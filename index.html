<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16225A">
<title>The Office — Wrestling Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&family=VT323&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   THE OFFICE — interface v3
   A 1990s management-sim desktop: dithered navy desk, bevelled stone
   windows with crimson title bars, dark data wells for the numbers.
   ===================================================================== */
:root{
 --desk:#22337A;--desk-dot:#1E2D6E;--deep:#16225A;
 --well:#0E1744;--well-row:#132055;--well-hover:#1C2B6B;--well-line:#2A3A82;
 --stone:#C8C1AE;--stone-2:#B8B09B;--stone-hi:#F3EDDC;--stone-lo:#776F5E;--paper:#EFE8D4;
 --ink:#000;--ink-2:#463F33;--ink-3:#6B6352;
 --blood:#9C1C25;--blood-hi:#CC3A40;--blood-lo:#560A10;
 --gold:#F2C12E;--gold-hi:#FFE68E;--gold-lo:#8F6A0B;
 --cyan:#7FE3F0;--white:#EEF1FF;--dim:#9DA8D8;
 --good:#5BD06A;--good-ink:#1E7A2D;--bad:#FF6B5E;--bad-ink:#A3161C;--warn:#FFA53A;
 --a5:#7CFF7A;--a4:#C6F36A;--a3:#EEF1FF;--a2:#FFB45C;--a1:#FF6B5E;
 --px:'Jersey 15','Arial Narrow','Franklin Gothic Medium',sans-serif;
 --jersey:'Jersey 10','Arial Narrow','Franklin Gothic Medium',Impact,sans-serif;
 --tt:'VT323','Lucida Console','Courier New',monospace;
 --bevel:inset 2px 2px 0 var(--stone-hi),inset -2px -2px 0 var(--stone-lo);
 --bevel-in:inset 2px 2px 0 var(--stone-lo),inset -2px -2px 0 var(--stone-hi);
 color-scheme:dark;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
*{font-synthesis:none}
b,strong{font-weight:inherit}
.lede b,.letter b,.outcome b,.crit b,.choice b,.opt b,.dlg>p b{color:var(--ink)}
html,body{margin:0;height:100%}
body{background:var(--desk);background-image:repeating-conic-gradient(var(--desk) 0 25%,var(--desk-dot) 0 50%);background-size:4px 4px;
 color:var(--ink);font:400 19px/1.3 var(--px);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--deep)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
p{margin:0 0 .6em}
h1,h2,h3{margin:0;font-weight:400}
:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
.dim{color:var(--ink-3)}.good{color:var(--good-ink)}.bad{color:var(--bad-ink)}
.well .dim,.tv .dim{color:var(--dim)}.well .good,.tv .good{color:var(--good)}.well .bad,.tv .bad{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
.tv .win .dim{color:var(--ink-3)}.tv .win .good{color:var(--good-ink)}.tv .win .bad{color:var(--bad-ink)}
.tv .win .well .dim{color:var(--dim)}.tv .win .well .good{color:var(--good)}.tv .win .well .bad{color:var(--bad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- bevelled chrome ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:5px 14px;border:2px solid var(--ink);background:var(--stone);box-shadow:var(--bevel);color:var(--ink);font-weight:600;font-size:18px;line-height:1.1;text-align:center;border-radius:0}
.btn:hover:not(:disabled){background:#D4CDBA}
.btn:active:not(:disabled),.btn[aria-pressed="true"]{box-shadow:var(--bevel-in);padding-top:6px;padding-bottom:4px}
.btn:disabled{color:var(--stone-lo);cursor:not-allowed;text-shadow:1px 1px 0 var(--stone-hi)}
.btn.go{background:var(--gold);box-shadow:inset 2px 2px 0 var(--gold-hi),inset -2px -2px 0 var(--gold-lo)}
.btn.go:hover:not(:disabled){background:#FFD149}
.btn.go:active:not(:disabled){box-shadow:inset 2px 2px 0 var(--gold-lo),inset -2px -2px 0 var(--gold-hi)}
.btn.red{background:var(--blood);color:#fff;box-shadow:inset 2px 2px 0 var(--blood-hi),inset -2px -2px 0 var(--blood-lo)}
.btn.red:hover:not(:disabled){background:#B0242D}
.btn.sm{min-height:28px;padding:3px 10px;font-size:17px}
.btn.link{border:0;background:none;box-shadow:none;min-height:0;padding:2px 4px;text-decoration:underline;text-underline-offset:3px;color:inherit;font-weight:500}
.well .btn.link{color:var(--cyan)}

.win{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--stone);border:2px solid var(--ink);box-shadow:var(--bevel),4px 4px 0 rgba(0,0,0,.45)}
.tbar{flex:none;display:flex;align-items:center;gap:10px;min-height:34px;padding:2px 4px 2px 10px;background:var(--blood);color:#fff;border-bottom:2px solid var(--ink);box-shadow:inset 0 2px 0 var(--blood-hi)}
.tbar h2,.tbar h3{font:26px/1 var(--jersey);letter-spacing:.02em;margin-right:auto;text-shadow:2px 2px 0 var(--blood-lo)}
.tbar h3{font-size:22px}
.tbar .note{font-size:16px;color:#F6D9D6}
.tbar .btn{min-height:26px;padding:2px 9px;font-size:16px}
.win.quiet .tbar{background:var(--deep);box-shadow:inset 0 2px 0 #2E3F92}
.win.quiet .tbar h3{text-shadow:2px 2px 0 #000}
.wbody{flex:1;min-height:0;overflow:auto;padding:12px 14px;scrollbar-color:var(--stone-lo) var(--stone-2)}
.wbody.tight{padding:6px}
.wbody.flush{padding:0}
.lede{color:var(--ink-2);max-width:70ch;margin-bottom:10px}

.well{background:var(--well);color:var(--white);border:2px solid;border-color:var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo);outline:2px solid var(--ink);outline-offset:-4px;scrollbar-color:var(--well-line) var(--well)}
.well.pad{padding:10px 12px}
.paper{background:var(--paper);border:2px solid;border-color:var(--stone-lo) var(--stone-hi) var(--stone-hi) var(--stone-lo)}

.tag{display:inline-block;padding:0 6px;border:1px solid currentColor;font-size:16px;line-height:1.5;white-space:nowrap}
.tag.tw{color:var(--good-ink)}.tag.tl{color:var(--bad-ink)}
.tag.hot{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.well .tag.tw,.tv .tag.tw{color:var(--good)}.well .tag.tl,.tv .tag.tl{color:var(--bad)}
.badge{display:inline-block;min-width:22px;padding:0 5px;background:var(--blood);color:#fff;border:1px solid var(--ink);font-size:16px;line-height:18px;text-align:center}
.badge.soft{background:var(--stone-2);color:var(--ink)}
.stars{color:var(--gold-lo);white-space:nowrap;letter-spacing:.04em}
.well .stars,.tv .stars{color:var(--gold)}

/* condition bar: pixel segments */
.bar{display:inline-block;vertical-align:middle;width:72px;height:10px;background:var(--well);border:1px solid var(--ink);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--good);background-image:repeating-linear-gradient(90deg,transparent 0 5px,rgba(0,0,0,.45) 5px 6px)}
.bar.warn i{background-color:var(--warn)}.bar.danger i{background-color:var(--bad)}.bar.cool i{background-color:var(--cyan)}.bar.gold i{background-color:var(--gold)}
.att{display:inline-block;min-width:2ch;text-align:right;font-weight:600}
.a5{color:var(--a5)}.a4{color:var(--a4)}.a3{color:var(--a3)}.a2{color:var(--a2)}.a1{color:var(--a1)}

.portrait{image-rendering:pixelated;width:36px;height:45px;border:1px solid var(--ink);background:var(--deep);flex:none;display:block}
.portrait.x2{width:72px;height:90px;border-width:2px}
.portrait.x3{width:144px;height:180px;border-width:2px}

/* ---------- application frame ---------- */
#app{height:100dvh;display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "nav view" "tick tick"}
#app[hidden]{display:none}
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:6px 10px 6px 12px;background:var(--deep);color:var(--white);border-bottom:2px solid var(--ink);box-shadow:0 2px 0 #2E3F92}
.logo{font:38px/.9 var(--jersey);color:var(--gold);text-shadow:2px 2px 0 var(--blood),4px 4px 0 #000;letter-spacing:.02em;white-space:nowrap}
.histnav{display:flex;gap:4px}
.histnav .btn{min-width:34px;padding:2px 8px;font-size:18px}
.readouts{display:flex;gap:2px;margin-left:auto;background:var(--ink);border:2px solid var(--ink)}
.ro{display:flex;flex-direction:column;justify-content:center;padding:3px 12px;background:var(--well);min-width:96px}
.ro small{font-size:15px;color:var(--dim)}
.ro b{font:26px/1 var(--jersey);color:var(--white);font-weight:400;letter-spacing:.02em}
.ro b.neg{color:var(--bad)}
#continue{min-width:190px;min-height:52px;flex-direction:column;gap:0;font:28px/1 var(--jersey);letter-spacing:.03em}
#continue small{font:400 16px/1.1 var(--px);letter-spacing:0}

.nav{grid-area:nav;display:flex;flex-direction:column;gap:2px;margin:10px 0 10px 10px;padding:8px 6px 10px;overflow:auto;background:var(--stone);border:2px solid var(--ink);box-shadow:var(--bevel),4px 4px 0 rgba(0,0,0,.45)}
.nav h4{margin:10px 4px 4px;font:22px/1 var(--jersey);font-weight:400;color:var(--blood);letter-spacing:.02em}
.nav h4:first-child{margin-top:0}
.nav .item{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;padding:5px 8px;border:2px solid transparent;background:none;text-align:left;font-weight:500;font-size:18px;color:var(--ink)}
.nav .item:hover{border-color:var(--ink);background:var(--stone-2)}
.nav .item[aria-current="page"]{border-color:var(--ink);background:var(--gold);box-shadow:inset 2px 2px 0 var(--gold-lo),inset -2px -2px 0 var(--gold-hi);font-weight:700}

#view{grid-area:view;min-height:0;min-width:0;padding:10px;overflow:hidden}
.screen{height:100%;display:grid;gap:10px;min-height:0}

.tick{grid-area:tick;display:flex;align-items:center;gap:12px;padding:3px 10px;background:var(--deep);border-top:2px solid var(--ink);font:20px/1.2 var(--tt);color:var(--cyan);overflow:hidden;white-space:nowrap}
.tick b{font-weight:400;background:var(--blood);color:#fff;padding:0 6px}
.tick button{border:0;background:none;color:inherit;padding:0;overflow:hidden;text-overflow:ellipsis;text-align:left;font:inherit}
.tick button:hover{color:var(--gold)}
.tick .keys{margin-left:auto;color:var(--dim);flex:none}

/* ---------- data tables ---------- */
.grid{width:100%;border-collapse:collapse;font-size:18px}
.grid th{position:sticky;top:0;z-index:1;background:var(--deep);color:var(--cyan);font-weight:500;font-size:16px;text-align:left;padding:5px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
.grid th.n,.grid td.n{text-align:right}
.grid th.c,.grid td.c{text-align:center}
.grid td{white-space:nowrap;padding:4px 8px;border-bottom:1px solid var(--well-line);vertical-align:middle}
.grid tbody tr:nth-child(even) td{background:var(--well-row)}
.grid tbody tr.pick{cursor:pointer}
.grid tbody tr.pick:hover td{background:var(--well-hover)}
.grid tbody tr[aria-selected="true"] td{background:var(--gold);color:var(--ink)}
.grid tbody tr[aria-selected="true"] .att,.grid tbody tr[aria-selected="true"] .dim,.grid tbody tr[aria-selected="true"] .stars{color:var(--ink)}
.grid tbody tr[aria-selected="true"] .tag.tw{color:var(--good-ink)}.grid tbody tr[aria-selected="true"] .tag.tl{color:var(--bad-ink)}
.grid td.wrap,.who small{white-space:normal}
.grid .sort{border:0;background:none;padding:0;color:inherit;font:inherit;white-space:nowrap}
.grid .sort:hover{color:var(--gold)}
.grid th[aria-sort="ascending"],.grid th[aria-sort="descending"]{color:var(--gold)}
.who{display:flex;align-items:center;gap:8px;min-width:170px}
.who b{display:block;font-weight:600}
.who small{display:block;font-size:15px;color:var(--dim)}
.grid tr[aria-selected="true"] .who small{color:var(--ink-2)}
.empty{padding:22px 16px;text-align:center;color:var(--dim)}
.paper .empty,.win>.wbody>.empty{color:var(--ink-3);border:2px dashed var(--stone-lo)}
.empty .btn{margin-top:10px}

/* key/value lists */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:600}
.well .kv dt{color:var(--dim)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:2px;background:var(--ink);border:2px solid var(--ink)}
.facts.three{grid-template-columns:repeat(3,1fr)}
.facts.two{grid-template-columns:1fr 1fr}
.wbody.tight>.well{min-height:100%}
.wbody>.well{overflow-x:auto}
.facts>div{background:var(--well);color:var(--white);padding:6px 10px}
.facts small{display:block;font-size:15px;color:var(--dim)}
.facts b{font:28px/1.05 var(--jersey);font-weight:400;letter-spacing:.02em}
.facts b.pos{color:var(--good)}.facts b.neg{color:var(--bad)}

/* ---------- office (desk) ---------- */
.s-desk{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);grid-template-areas:"mission ledger" "tray dates" "tray squad"}
.s-desk.nomission{grid-template-areas:"ledger ledger" "tray dates" "tray squad";grid-template-rows:auto minmax(0,1fr) minmax(0,1fr)}
.criteria{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.crit{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;background:var(--stone-2);border:2px solid var(--ink)}
.crit.met{background:#BFE3B3}
.crit i{font-style:normal;font:22px/1 var(--jersey);width:18px;flex:none}
.crit b{display:block;font-weight:600}
.crit small{display:block;color:var(--ink-2);font-size:16px}
.countdown{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.countdown b{font:34px/1 var(--jersey);color:var(--blood);font-weight:400}
.tray{list-style:none;margin:0;padding:0}
.tray li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--well-line)}
.tray li:last-child{border-bottom:0}
.tray .ic{font:24px/1 var(--jersey);text-align:center;color:var(--cyan)}
.tray .urgent .ic{color:var(--bad)}
.tray .ok .ic{color:var(--good)}
.tray b{font-weight:600;display:block}
.tray small{color:var(--dim);font-size:16px}

/* ---------- inbox ---------- */
.s-inbox{grid-template-columns:minmax(260px,380px) minmax(0,1fr)}
.msglist{list-style:none;margin:0;padding:0}
.msglist button{display:grid;grid-template-columns:12px 1fr auto;gap:0 8px;width:100%;padding:7px 10px;border:0;border-bottom:1px solid var(--well-line);background:none;color:var(--white);text-align:left}
.msglist li:nth-child(even) button{background:var(--well-row)}
.msglist button:hover{background:var(--well-hover)}
.msglist button[aria-current="true"]{background:var(--gold);color:var(--ink)}
.msglist .pip{width:8px;height:8px;margin-top:6px;background:transparent;border:1px solid transparent}
.msglist .unread .pip{background:var(--cyan);border-color:var(--ink)}
.msglist .need .pip{background:var(--bad);border-color:var(--ink)}
.msglist .from{font-size:16px;color:var(--dim)}
.msglist button[aria-current="true"] .from,.msglist button[aria-current="true"] .wk{color:var(--ink-2)}
.msglist .wk{font-size:15px;color:var(--dim)}
.msglist .subj{grid-column:2/4;font-weight:500}
.msglist .unread .subj,.msglist .need .subj{font-weight:700}
.letter{padding:18px 22px;max-width:74ch}
.letter .meta{font-size:16px;color:var(--ink-3);border-bottom:2px solid var(--stone-lo);padding-bottom:8px;margin-bottom:12px}
.letter h2{font:36px/1 var(--jersey);color:var(--blood);margin-bottom:12px}
.choices{display:grid;gap:6px;margin-top:16px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 12px;border:2px solid var(--ink);background:var(--stone);box-shadow:var(--bevel);color:var(--ink)}
.choice:hover:not(:disabled){background:var(--gold)}
.choice:active:not(:disabled){box-shadow:var(--bevel-in)}
.choice:disabled{opacity:.55;cursor:not-allowed}
.choice b{font-weight:700}
.choice span{font-size:17px;color:var(--ink-2)}
.outcome{margin-top:14px;padding:10px 12px;background:var(--stone);border:2px solid var(--ink);border-left:8px solid var(--blood)}

/* ---------- roster / profile ---------- */
.s-full{grid-template-rows:minmax(0,1fr)}
.s-split{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.s-split.s-train{grid-template-columns:minmax(0,2.5fr) minmax(290px,1fr)}
.s-split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.s-profile{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head head" "atts train record"}
.phead{grid-area:head}
.phead .wbody{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.phead .name{font:52px/.9 var(--jersey);color:var(--blood);letter-spacing:.01em}
.phead .handle{font-size:21px;font-weight:600;margin:4px 0 6px}
.phead .acts{display:flex;flex-direction:column;gap:6px;align-self:stretch;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:2px 8px;background:var(--stone-2);border:1px solid var(--ink);font-size:17px}
.attrs{display:grid;gap:3px}
.attr{display:grid;grid-template-columns:1fr auto 76px;gap:10px;align-items:center;padding:3px 4px;border-bottom:1px solid var(--well-line)}
.attr span:first-child{color:var(--dim)}
.attrs h4{margin:8px 4px 2px;font:20px/1 var(--jersey);font-weight:400;color:var(--cyan)}
.attrs h4:first-child{margin-top:0}
.section-h{font:22px/1 var(--jersey);color:var(--blood);margin:12px 0 6px}
.section-h:first-child{margin-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:4px 6px;border-radius:0;box-shadow:var(--bevel-in);max-width:100%}
.well select{background:var(--deep);color:var(--white);box-shadow:none;border-color:var(--well-line)}
label.field{display:grid;gap:3px;font-size:16px;color:var(--ink-3)}
label.field select{font-size:18px}

/* ---------- offers ---------- */
.s-offers{grid-template-columns:minmax(0,1.4fr) minmax(360px,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"ledger ledger" "list detail"}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px;margin-bottom:10px}
.matchup .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.matchup .side b{font:26px/1 var(--jersey);font-weight:400;color:var(--white)}
.matchup .vs{font:40px/1 var(--jersey);color:var(--gold)}
.purse{font:44px/1 var(--jersey);color:var(--blood)}
.notes{list-style:none;margin:8px 0;padding:0;display:grid;gap:4px}
.notes li{padding:4px 8px;border-left:6px solid var(--stone-lo);background:var(--stone-2);font-size:17px}
.notes li.good{border-left-color:var(--good-ink);color:var(--ink)}
.notes li.bad{border-left-color:var(--bad-ink);color:var(--ink)}

/* ---------- pyramid ---------- */
.tiers{display:grid;gap:6px;padding:10px}
.tier{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.tier>strong{font:22px/1 var(--jersey);font-weight:400;color:var(--cyan);text-align:right}
.tier.apex>strong{color:var(--gold)}
.tier .entries{display:flex;flex-wrap:wrap;gap:4px}
.pent{display:flex;flex-direction:column;min-width:130px;padding:3px 8px;background:var(--well-row);border:1px solid var(--well-line);border-left:6px solid var(--dim)}
.pent.mine{border-left-color:var(--gold);background:#2A3470}
.pent b{font-weight:600}
.pent small{font-size:15px;color:var(--dim)}
.tier.apex .pent{border:2px solid var(--gold);border-left-width:6px;background:#3A3416}

/* ---------- dialogs + toast ---------- */
dialog{padding:0;border:2px solid var(--ink);background:var(--stone);color:var(--ink);max-width:min(760px,94vw);width:100%;box-shadow:var(--bevel),6px 6px 0 rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(8,12,40,.65)}
dialog .dlg{padding:14px 16px;max-height:72vh;overflow:auto}
dialog .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:10px 16px;border-top:2px solid var(--stone-lo)}
.terms-compare{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.terms-compare>div{padding:8px 10px;background:var(--well);color:var(--white);border:2px solid var(--ink)}
.terms-compare small{display:block;color:var(--dim);font-size:15px}
.terms-compare b{display:block;margin-top:2px;font-weight:600}
.talk-log{max-height:34vh;overflow:auto;padding:4px 12px;font:20px/1.2 var(--tt)}
.talk-line{padding:6px 0;border-bottom:1px solid var(--well-line)}
.talk-line:last-child{border-bottom:0}
.talk-line b{font-weight:400;color:var(--gold)}
.talk-line p{margin:2px 0 0}
.talk-actions{display:grid;gap:6px;margin-top:12px}
.talk-actions p{margin:0 0 2px;font-weight:600}
.talk-outcome{margin-top:12px;padding:10px 12px;background:var(--paper);border:2px solid var(--ink);border-left:8px solid var(--blood)}
.talk-outcome b{font:24px/1 var(--jersey);font-weight:400;color:var(--blood)}
#toast{position:fixed;right:16px;bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:80;max-width:min(420px,90vw);background:var(--stone);border:2px solid var(--ink);box-shadow:var(--bevel),4px 4px 0 rgba(0,0,0,.5);padding:8px 12px 8px 14px;border-left:8px solid var(--gold);font-weight:600;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .15s,transform .15s}
#toast.show{opacity:1;transform:none}

/* ---------- title screen ---------- */
.title{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:var(--desk);background-image:repeating-conic-gradient(var(--desk) 0 25%,var(--desk-dot) 0 50%);background-size:4px 4px;overflow:auto}
.title[hidden]{display:none}
.title .win{width:min(640px,100%)}
.title .hero{padding:26px 26px 18px;text-align:center;background:var(--deep);border-bottom:2px solid var(--ink)}
.title .ropes{height:6px;margin:0 -26px 18px;background:repeating-linear-gradient(0deg,var(--blood) 0 2px,transparent 2px 4px)}
.title .ropes.b{margin:18px -26px 0}
.title h1{font:clamp(84px,17vw,150px)/.78 var(--jersey);color:var(--gold);text-shadow:4px 4px 0 var(--blood),8px 8px 0 #000;letter-spacing:.01em}
.title .sub{font:24px/1.1 var(--tt);color:var(--cyan);margin-top:14px}
.title .menu{display:grid;gap:8px;padding:18px 26px}
.title .menu .btn{min-height:48px;font:28px/1 var(--jersey);letter-spacing:.03em}
.title .keys{padding:0 26px 18px;font-size:17px;color:var(--ink-2);text-align:center}

/* ---------- MATCH NIGHT ---------- */
.tv{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--desk);background-image:repeating-conic-gradient(var(--desk) 0 25%,var(--desk-dot) 0 50%);background-size:4px 4px;color:var(--white)}
.tv[hidden]{display:none}
.strip{flex:none;display:flex;align-items:center;gap:18px;padding:6px 14px;background:var(--blood);border-bottom:2px solid var(--ink);box-shadow:inset 0 2px 0 var(--blood-hi);font:24px/1 var(--jersey);letter-spacing:.03em}
.strip b{font-weight:400;color:var(--gold);text-shadow:2px 2px 0 var(--blood-lo)}
.strip span{color:#F6D9D6}
.strip .r{margin-left:auto}
.stage{flex:1;min-height:0;display:grid;gap:10px;padding:10px;overflow:auto}
.stage .win{color:var(--ink)}
.tv-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:var(--deep);border-top:2px solid var(--ink);flex-wrap:wrap}
.tv-foot .btn.go{min-height:48px;min-width:220px;font:28px/1 var(--jersey);letter-spacing:.03em}
/* prep */
.s-prep{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"tape contract" "plan plan"}
.tape{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px}
.tape .nm{font:30px/1 var(--jersey);color:var(--gold);text-align:center;margin-top:4px}
.tape .nm.them{color:var(--white)}
.tape .side{display:flex;flex-direction:column;align-items:center}
.cmp{display:grid;gap:5px}
.cmpr{display:grid;grid-template-columns:2.4ch 1fr 6ch 1fr 2.4ch;gap:6px;align-items:center;font-size:17px}
.cmpr .lab{text-align:center;color:var(--dim);font-size:15px}
.cmpr .l,.cmpr .r{height:10px;background:var(--deep);border:1px solid var(--ink);position:relative}
.cmpr .l i,.cmpr .r i{position:absolute;top:0;bottom:0;background-image:repeating-linear-gradient(90deg,transparent 0 5px,rgba(0,0,0,.45) 5px 6px)}
.cmpr .l i{right:0;background-color:var(--gold)}.cmpr .r i{left:0;background-color:var(--dim)}
.cmpr .v{text-align:right}.cmpr .v.r2{text-align:left}
.cmpr .v.up{color:var(--a5)}
.warnings{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px}
.warnings li{padding:3px 8px;border-left:6px solid var(--bad-ink);background:var(--stone-2);font-size:17px}
.planset{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.5fr);gap:10px;min-height:0}
.decide{border:0;margin:0;padding:0;min-width:0}
.decide legend{font:22px/1 var(--jersey);color:var(--blood);margin-bottom:6px;padding:0}
.decide .opts{display:grid;gap:5px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:7px 10px;border:2px solid var(--ink);background:var(--stone);box-shadow:var(--bevel);color:var(--ink)}
.opt:hover{background:#D4CDBA}
.opt b{font-weight:700}
.opt span{font-size:16px;color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--gold);box-shadow:inset 2px 2px 0 var(--gold-lo),inset -2px -2px 0 var(--gold-hi)}
.opt .fits{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.opt .fits i{font-style:normal;font-size:15px;padding:0 5px;background:var(--well);color:var(--a5);border:1px solid var(--ink)}
/* live */
.score{flex:none;display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding:8px 14px;background:var(--deep);border-bottom:2px solid var(--ink)}
.score .side{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.score .side.them{grid-template-columns:1fr auto;text-align:right}
.score .side.them .portrait{grid-column:2;grid-row:1/3}
.score .side .portrait{grid-row:1/3}
.score h2{font:40px/.9 var(--jersey);color:var(--gold)}
.score .them h2{color:var(--white)}
.stam{height:12px;background:var(--well);border:2px solid var(--ink);position:relative}
.stam i{position:absolute;top:0;bottom:0;left:0;background:var(--good);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.45) 6px 8px);transition:width .4s}
.them .stam i{left:auto;right:0}
.stam.low i{background-color:var(--bad)}
.score .mid{text-align:center;min-width:200px;padding:4px 14px;background:var(--well);border:2px solid var(--ink)}
.score .live-stars{font:38px/1 var(--jersey);color:var(--gold);min-height:38px;letter-spacing:.04em}
.score .clock{font:30px/1 var(--tt);color:var(--white)}
.score .phase{font:20px/1 var(--tt);color:var(--cyan)}
.mom{flex:none;height:12px;display:flex;background:var(--dim);border-bottom:2px solid var(--ink)}
.mom i{display:block;background:var(--gold);transition:width .5s;border-right:2px solid var(--ink)}
.s-live{grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr)}
.feed{display:flex;flex-direction:column;min-height:0;height:100%}
.now{flex:none;min-height:3.4em;display:flex;align-items:center;gap:16px;padding:14px 16px;font:clamp(26px,3.2vw,40px)/1.1 var(--tt);border-bottom:2px solid var(--well-line);background:var(--deep)}
.now .t{color:var(--dim);font-size:.6em;flex:none;width:3.4em}
.now.big{color:var(--gold)}
.now.count{justify-content:center;font-size:clamp(56px,9vw,104px);color:var(--gold)}
.now.count .t{display:none}
.now.crowd{color:var(--cyan)}.now.bad,.now.alert{color:var(--bad)}.now.agent,.now.you{color:var(--dim)}
.now.rating{color:var(--gold);justify-content:center}
.now .tx{animation:land .18s steps(3)}
@keyframes land{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.past{flex:1;min-height:0;overflow:auto;list-style:none;margin:0;padding:8px 16px;font:22px/1.25 var(--tt);color:var(--dim)}
.past li{display:flex;gap:16px;padding:2px 0}
.past li .t{flex:none;width:3.4em;opacity:.7}
.past li.crowd{color:#63BFCB}.past li.bad,.past li.alert{color:#D9776E}.past li.big{color:#D9BC55}.past li.you{color:#BAC4EA}
.past li:nth-child(n+6){opacity:.7}.past li:nth-child(n+9){opacity:.5}
.bench{display:flex;flex-direction:column;gap:10px;min-height:0}
.gauge{margin-bottom:10px}
.gauge label{display:flex;justify-content:space-between;font-size:17px;color:var(--ink-2);margin-bottom:3px}
.gauge label b{font-weight:700;color:var(--ink)}
.gauge label b.warnv{color:var(--bad-ink)}
.gbar{height:14px;background:var(--well);border:2px solid var(--ink);position:relative}
.gbar i{position:absolute;inset:0 auto 0 0;background:var(--cyan);background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.45) 6px 8px);transition:width .4s}
.callsleft{display:flex;justify-content:space-between;font-size:17px;color:var(--ink-2)}
.callsleft span{color:var(--blood);font-size:18px;letter-spacing:.2em}
.calls{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.call{display:flex;gap:8px;align-items:center;justify-content:flex-start;text-align:left;min-height:40px}
.call kbd{font:16px/1 var(--px);background:var(--well);color:var(--cyan);border:1px solid var(--ink);padding:2px 5px}
.callhint{min-height:2.6em;margin-top:8px;padding:6px 8px;font:19px/1.15 var(--tt);color:var(--cyan)}
.speed{display:flex;gap:4px;flex-wrap:wrap}
.speed .btn{flex:1;min-width:0;padding:3px 6px;font-size:16px;min-height:30px}
.decision{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(8,12,40,.72);padding:16px}
.decision[hidden]{display:none}
.decision .win{width:min(640px,100%);color:var(--ink)}
.decision h2{font:40px/1 var(--jersey);color:var(--blood);margin:0 0 6px}
.decision .opts{display:grid;gap:6px;margin-top:12px}
/* result */
.s-result{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.final{grid-column:1/-1;text-align:center;padding:10px 0 4px}
.final .bigstars{font:clamp(70px,11vw,124px)/1 var(--jersey);color:var(--gold);text-shadow:4px 4px 0 var(--blood),8px 8px 0 #000;letter-spacing:.04em}
.final .verdict{font:28px/1.2 var(--tt);color:var(--cyan);margin-top:6px}
.cons{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.cons li{padding:5px 10px;background:var(--stone-2);border:1px solid var(--ink);border-left:8px solid var(--stone-lo)}
.cons li.up{border-left-color:var(--good-ink)}.cons li.down{border-left-color:var(--bad-ink)}
.fulllog{font:20px/1.3 var(--tt);color:var(--dim);margin:0;padding:8px 12px;list-style:none}
.fulllog li{display:flex;gap:14px}.fulllog .t{flex:none;width:3.4em;opacity:.7}
.fulllog .big{color:#D9BC55}.fulllog .crowd{color:#63BFCB}.fulllog .bad,.fulllog .alert{color:#D9776E}

/* ---------- smaller screens: the desk becomes a scrolling page ---------- */
@media (max-width:1100px){
 .s-profile{grid-template-columns:1fr 1fr;grid-template-areas:"head head" "atts train" "record record";grid-template-rows:auto auto auto;height:auto}
 .planset{grid-template-columns:1fr 1fr}
 .planset .decide:first-child{grid-column:1/-1}
}
@media (max-width:900px){
 body{overflow:auto}
 #app{height:auto;min-height:100dvh;grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;grid-template-areas:"top" "nav" "view" "tick"}
 .top{position:sticky;top:0;z-index:30;flex-wrap:wrap;gap:8px}
 .logo{font-size:30px}
 .readouts{order:3;margin-left:0;width:100%}
 .readouts{display:grid;grid-template-columns:1fr 1fr}
 .ro{min-width:0;padding:3px 8px}.ro b{font-size:22px}
 .tbar .note{display:none}
 .win{scroll-margin-top:180px}
 #continue{margin-left:auto;min-width:150px;min-height:44px;font-size:24px}
 .nav{flex-direction:row;align-items:center;margin:8px 8px 0;padding:6px;overflow-x:auto;gap:4px}
 .nav h4{display:none}
 .nav .item{width:auto;white-space:nowrap;flex:none}
 #view{overflow:visible;padding:8px}
 .screen{height:auto;grid-template-columns:1fr!important;grid-template-rows:none!important;grid-template-areas:none!important}
 .screen>*{grid-area:auto!important}
 .wbody{overflow:visible}
 .wbody.tight,.wbody.flush{overflow-x:auto}
 .phead .wbody{grid-template-columns:auto 1fr}
 .phead .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
 .phead .name{font-size:40px}
 .portrait.x3{width:96px;height:120px}
 .criteria{grid-template-columns:1fr}
 .tier{grid-template-columns:1fr}.tier>strong{text-align:left}
 .tick .keys{display:none}
 #toast{left:12px;right:12px;bottom:56px}
 .tv{overflow:auto}
 .strip{flex-wrap:wrap;gap:4px 14px;font-size:20px}
 .stage{overflow:visible;flex:none}
 .planset{grid-template-columns:1fr}
 .score{grid-template-columns:1fr 1fr;gap:8px}
 .score .mid{grid-column:1/3;grid-row:1;min-width:0}
 .score h2{font-size:28px}
 .score .portrait{width:36px;height:45px}
 .now{font-size:24px;min-height:4.4em}
 .now.count{font-size:60px}
 .past{max-height:9em;font-size:19px}
 .tape{grid-template-columns:1fr 1fr}
 .tape .cmp{grid-column:1/-1;grid-row:2}
 .tv-foot{position:sticky;bottom:0}
}

/* ---------- MATCH PREPARATION: LAPTOP / TABLET / PHONE ----------
   Keep the 90s chrome, but let one stage scroll instead of giving the
   game-plan controls a postage-stamp internal scrollbar. Plan first. */
.prep-context{display:none;align-items:center;flex-wrap:wrap;gap:4px 14px;margin:0 0 10px;padding:7px 10px;
 background:var(--well);border:2px solid var(--ink);color:var(--white);font-size:18px}
.prep-context b{color:var(--gold)}
.prep-context span{color:var(--dim)}
/* Landscape laptops with a short viewport: controls on the left, contract
   alongside them, comparison below. Larger desktop layouts stay unchanged. */
@media (min-width:1201px) and (max-height:980px){
 .tv .s-prep{grid-template-columns:minmax(0,1.42fr) minmax(0,1fr);
  grid-template-rows:max-content max-content;
  grid-template-areas:"plan contract" "tape contract";
  align-content:start;align-items:start}
 .tv .s-prep>.win{height:auto;align-self:start}
 .tv .s-prep>.win[style*="grid-area:contract"]{align-self:stretch}
 .tv .s-prep .wbody{flex:0 0 auto;overflow:visible}
 .tv .s-prep .planset{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,1.15fr)}
 .tv .s-prep .prep-context{display:flex}
}
/* A narrower laptop or tablet: put the decisions before the reference
   information. The fixed-height stage itself supplies the only scrollbar. */
@media (max-width:1200px){
 .tv .s-prep{grid-template-columns:minmax(0,1fr);
  grid-template-rows:max-content max-content max-content;
  grid-template-areas:"plan" "contract" "tape";
  align-content:start;align-items:start}
 .tv .s-prep>.win{height:auto;align-self:start}
 .tv .s-prep .wbody{flex:0 0 auto;overflow:visible}
 .tv .s-prep .planset{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tv .s-prep .planset .decide:first-child{grid-column:1/-1}
 .tv .s-prep .prep-context{display:flex}
}
/* General mobile layout overrides grid areas with !important, so the
   prep cards need explicit visual ordering independent of DOM order. */
@media (max-width:900px){
 .tv .s-prep>.win:nth-child(1){order:3}
 .tv .s-prep>.win:nth-child(2){order:2}
 .tv .s-prep>.win:nth-child(3){order:1}
 .tv .s-prep{gap:8px;padding:8px;overflow:visible}
 .tv .s-prep .wbody{overflow:visible}
 .tv .s-prep .tape{grid-template-columns:1fr 1fr;gap:8px}
 .tv .s-prep .tape .cmp{grid-column:1/-1;grid-row:2}
 .tv .s-prep .tape .side:last-child{grid-column:2;grid-row:1}
 .tv .s-prep .tape .side:first-child{grid-column:1;grid-row:1}
}
/* One-column choices remain comfortably tappable without sideways panning. */
@media (max-width:620px){
 .tv .s-prep .planset{grid-template-columns:minmax(0,1fr);gap:12px}
 .tv .s-prep .planset .decide:first-child{grid-column:auto}
 .tv .s-prep .plan-choices{grid-template-columns:minmax(0,1fr)!important}
 .tv .s-prep .opt{min-height:46px}
 .tv .s-prep .cmpr{grid-template-columns:2.4ch minmax(0,1fr) 5ch minmax(0,1fr) 2.4ch;gap:4px;font-size:16px}
 .tv .s-prep .cmpr .lab{font-size:14px}
 .tv .s-prep .tape .nm{font-size:23px}
 .tv .s-prep .tape .portrait{width:56px;height:70px}
 .tv .s-prep .prep-context{font-size:17px}
 .tv-foot{gap:5px 10px}
 .tv-foot .btn.go{width:100%;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Two management meetings a week: spend them on a promoter OR a wrestler. */
function checkIn(id,choice){

 if(!['listen','promise','bonus'].includes(choice))return {error:'Choose a conversation approach.'};
 if(choice==='promise'&&w.promise?.status==='open')return {error:`You already promised ${w.short} a featured match. Honour or break that first.`};
 if(choice==='bonus'&&S.cash<120)return {error:'A £120 bonus is beyond your available cash.'};

 }else if(choice==='bonus'){

  S.offers.unshift(extra);
  msg({from:p.voice+', '+p.name,subject:`Invitation: ${labels[S.week]} in week ${target}`,kind:'info',body:[`A ${D.SLOTS[extra.slot].name.toLowerCase()} booking is available for week ${target}. Reply no later than week ${S.week+1}; the event slot will not be kept open for you.`,`The agreed finish is ${D.FINISHES[extra.finish].name.toLowerCase()}. A training camp covering that date would prevent your wrestler from accepting.`,`See Bookings for the offer and negotiate the exact terms if you wish.`]});
 }
 for(const p of ps){
  S.offers.push(genOffer(p,0));

 }
 for(const fd of Object.values(S.feuds)){
  if(fd.closed)continue;const w=W(fd.wid);if(!w||w.injury)continue;
  if(fd.heat>=70&&fd.matches>=2&&ps.length){const p=ps.slice().sort((a,b)=>b.reach-a.reach)[0];S.offers.unshift({...genOffer(p,2),rid:fd.rid,wid:fd.wid,slot:'main',tag:'Blow-off',finish:rand()<.55?'win_clean':'lose_clean',boost:1.4});}
  else if(fd.heat>=40&&rand()<.6&&ps.length){const p=one(ps),base=genOffer(p,1);S.offers.unshift({...base,rid:fd.rid,wid:fd.wid,slot:D.SLOT_ORDER[Math.min(3,D.SLOT_ORDER.indexOf(base.slot)+1)],tag:'Rematch',boost:1.15});}
 }
 // Keep a reliable route to weekly income, but offer future trade-offs too.
 const today=S.offers.filter(o=>o.eventAbs===now).length;

const TALK_TOPICS={fee:'Increase the appearance fee',protect:'Protect a clean loss',slot:'Move higher on the card'};

 }
 if(t.step!=='reason'||!move.startsWith('arg:'))return {error:'Choose an argument.'};

function fitNotes(o,w){
 const p=G.P(o.pid),notes=[],best=D.STYLE_PLAN[w.style];
 if(best===p.likes)notes.push(['good',`${p.name} crowds love a ${w.style.toLowerCase()} worker.`]);
 else notes.push(['',`${p.name} crowds want “${planFor(p).name}”. ${w.short}’s best plan is “${D.PLANS[best].name}”.`]);
 const f=G.F(o.rid);if(f.safe<55)notes.push(['bad',`${f.name} is an unsafe worker.`]);
 if(w.fatigue>=45)notes.push(['bad',`${w.short} is tired (fatigue ${w.fatigue}).`]);
 if(D.FINISHES[o.finish].heat<-3&&w.heat>=60)notes.push(['bad',`A clean loss will cost ${w.short} heat.`]);
 const fd=G.feud(w.id,o.rid);if(fd&&!fd.closed&&fd.heat>0)notes.push(['good',`Rivalry heat ${fd.heat}: expect a hotter crowd.`]);
 return `<ul class="notes">${notes.map(([k,t])=>`<li class="${k}">${esc(t)}</li>`).join('')}</ul>`;
}
function offerPick(o){
 const s=S(),p=G.P(o.pid);
 const options=s.roster.filter(w=>(!o.wid||o.wid===w.id)&&G.availableAt(w,o.eventAbs));
 const sel=options.find(w=>w.id===o.talk?.wid)||options.find(w=>w.id===pick[o.id])||options.slice().sort((a,b)=>(D.STYLE_PLAN[b.style]===p.likes)-(D.STYLE_PLAN[a.style]===p.likes)||a.fatigue-b.fatigue)[0];
 if(sel)pick[o.id]=sel.id;
 return {options,sel};
}

function renderMeeting(oid,wid){
 const res=G.meeting(oid,wid);if(res.error){toast(res.error);return}
 const o=res.offer,t=res.talk,w=G.W(wid),p=G.P(o.pid),f=G.F(o.rid),d=$('#modal');d.dataset.talkoid=oid;
 const term=(slot,fin,fee)=>`${esc(D.SLOTS[slot].name)}, ${esc(D.FINISHES[fin].name.toLowerCase())}, ${money(fee)}`;
 const transcript=t.log.map(x=>`<div class="talk-line"><b>${esc(x.who)}</b><p>${esc(x.text)}</p></div>`).join('');
 let opts='';
 if(t.step==='start')opts=`<div class="talk-actions"><p>What are you asking ${esc(p.voice)} to change?</p><button class="choice" data-talkaction="ask:fee" data-oid="${oid}" data-wid="${wid}"><b>Increase the fee</b><span>Ask for 20% more. A counteroffer may be smaller.</span></button>${o.finish==='lose_clean'?`<button class="choice" data-talkaction="ask:protect" data-oid="${oid}" data-wid="${wid}"><b>Protect the loss</b><span>Keep the loss, but make it competitive. Expect lower pay.</span></button>`:''}${o.slot!=='main'?`<button class="choice" data-talkaction="ask:slot" data-oid="${oid}" data-wid="${wid}"><b>Better billing</b><span>A higher spot on the card, possibly for less money.</span></button>`:''}</div>`;
 else if(t.step==='reason')opts=`<div class="talk-actions"><p>Make your argument. Trust, ${esc(w.short)}’s reputation, the crowd and the promoter’s priorities all count.</p><button class="choice" data-talkaction="arg:crowd" data-oid="${oid}" data-wid="${wid}"><b>Business case</b><span>${esc(w.short)} brings viewers. Stronger with a popular wrestler and a showman booker.</span></button><button class="choice" data-talkaction="arg:reliability" data-oid="${oid}" data-wid="${wid}"><b>Track record</b><span>Dependable work and a clean finish. Suits a traditional booker.</span></button><button class="choice" data-talkaction="arg:trade" data-oid="${oid}" data-wid="${wid}"><b>Financial compromise</b><span>Give ground on money for a better opportunity.</span></button></div>`;
 else opts=`<div class="talk-outcome"><b>${esc(t.verdict.charAt(0).toUpperCase()+t.verdict.slice(1))}</b><p>${esc(t.detail)}</p><p class="dim">The current terms are exactly what will be booked. Closing keeps the offer open.</p>${t.verdict!=='original'&&(o.slot!==t.original.slot||o.finish!==t.original.finish||G.purse(o,w)!==t.original.fee)?`<button class="btn sm" data-talkaction="revert" data-oid="${oid}" data-wid="${wid}">Go back to the original offer</button>`:''}</div>`;
 d.innerHTML=`<header class="tbar"><h2>${esc(p.name)}: meeting with ${esc(p.voice)}</h2></header><div class="dlg"><p><b>${esc(w.name)} v ${esc(f.name)}</b></p><div class="terms-compare"><div><small>Original offer</small><b>${term(t.original.slot,t.original.finish,t.original.fee)}</b></div><div><small>Current terms</small><b>${term(o.slot,o.finish,G.purse(o,w))}</b></div></div><div class="talk-log well">${transcript}</div>${opts}</div><div class="foot"><button class="btn" data-dlg="close">Close, keep offer open</button><button class="btn go" data-talkbook="${oid}" data-wid="${wid}">Sign current terms</button></div>`;
 if(!d.open)d.showModal();const lg=d.querySelector('.talk-log');if(lg)lg.scrollTop=lg.scrollHeight;d.querySelector('[data-talkaction], [data-talkbook]')?.focus();

function proceed(){
 const s=S();
 if(G.pending().length){openMsg=G.pending()[0].id;go('inbox');toast('Reply to the messages marked in red first.');return}
 if(s.card.length){startNight();return}
 if(!s.roster.length&&s.week===1){go('scouting');toast('Sign a wrestler first.');return}
 G.endWeek();
 if(s.over){gameOver();return}
 openMsg=null;past=[];ahead=[];route={s:'desk',id:null};render(true);
 toast(`Week ${s.week}. ${s.offers.length} ${plural(s.offers.length,'offer')} on the table.`);
}
function gameOver(){
 dialog('The office is closed',`<p>The bank has called in your overdraft. After ${S().season>1?S().season-1+' seasons and ':''}${S().history.length} matches, the territory goes on without you.</p>`,[['Start again','newgame','go']]);
}

/* ======================= MATCH NIGHT ======================= */
const NIGHT_STORE='the-office-v23-match'; // same key: preserve existing mid-match saves
function persistNight(){
 if(!night?.queue)return;
 try{const m=night.M?{...night.M,rState:night.M.r?.getState?.()}:null;
 localStorage.setItem(NIGHT_STORE,JSON.stringify({queue:night.queue,i:night.i,speed:night.speed,results:night.results,plan:night.plan,promo:night.promo,stage:night.stage||'prep',M:m,past:night.past||[]}));
 }catch(e){console.warn('Match autosave failed',e)}
}
function clearNight(){try{localStorage.removeItem(NIGHT_STORE)}catch(e){}}
function openTV(){$('#toast').classList.remove('show');$('#tv').hidden=false;document.body.style.overflow='hidden'}
function resumeNight(){
 let saved=null;try{saved=JSON.parse(localStorage.getItem(NIGHT_STORE)||'null')}catch(e){}
 if(!saved||!Array.isArray(saved.queue)||!S()?.card?.length)return false;
 night={...saved,paused:true};
 if(night.i>=night.queue.length){endNight();return true}
 openTV();
 if(saved.stage==='live'&&saved.M){
  const restored=Mx.restore(saved.M);
  bell();clearTimeout(night.timer);night.M=restored;night.past=saved.past||[];night.paused=true;
  updateLive();const last=restored.log?.[restored.log.length-1];if(last)showLine(last,true);
  if(restored.decision&&!restored.queue.length)showDecision();
 }else if(saved.stage==='promo')showPromos();else if(saved.stage==='meeting')showMeeting();else prep();
 persistNight();return true;
}
const SPEED={slow:{line:2600,pause:1100},normal:{line:1500,pause:750},fast:{line:520,pause:260},skip:{line:0,pause:0}};
function startNight(){
 night={queue:S().card.slice().sort((a,b)=>D.SLOTS[a.slot].rank-D.SLOTS[b.slot].rank).map(c=>c.id),i:0,speed:night?.speed||'normal',results:[]};
 openTV();night.stage='prep';prep();persistNight();
}
function current(){return S().card.find(c=>c.id===night.queue[night.i])}
function strip(c,label){const p=G.P(c.pid);return `<div class="strip"><b>${esc(p.name)} ${label||'live'}</b><span>${esc(p.venue)}</span><span class="r">Match ${Math.min(night.i+1,night.queue.length)} of ${night.queue.length}</span></div>`}
function cmpRow(label,a,b){const up=a>b;return `<div class="cmpr"><span class="v ${up?'up':''}">${a}</span><span class="l"><i style="width:${a}%"></i></span><span class="lab">${label}</span><span class="r"><i style="width:${b}%"></i></span><span class="v r2">${b}</span></div>`}
function prep(){
 const c=current();if(!c)return endNight();
 const w=G.W(c.wid),f=G.F(c.rid),p=G.P(c.pid),best=D.STYLE_PLAN[w.style],foeBest=D.STYLE_PLAN[f.style];
 night.plan=night.plan&&night.plan.cid===c.id?night.plan:{cid:c.id,game:best,leash:w.psych>=75&&w.ego<75?'free':'script',talk:'none'};
 const P=night.plan;P.promo??='challenge';
 const warn=[];if(w.intensity==='hard'&&w.training!=='rest'&&w.training!=='promo')warn.push('Hard training this week will leave them tired before the bell.');if(w.fatigue>=45)warn.push(`${w.short} is tired (fatigue ${w.fatigue}). Stamina will run out sooner.`);if(w.morale<35)warn.push(`${w.short}’s morale is low (${w.morale}). Less likely to listen.`);if(w.flags.pushThrough)warn.push(`${w.short} is carrying a bad back.`);if(w.flags.dive)warn.push(`${w.short} plans to dive off the balcony.`);
 const fnotes=[];if(f.safe<55)fnotes.push('Unsafe: spots against them go wrong more often.');if(f.ego>=68)fnotes.push('Big ego: may start getting stiff.');if(f.psych>=85)fnotes.push('A brilliant storyteller.');if(f.ring>=80)fnotes.push('Excellent in the ring.');
 const fits=g=>[g===p.likes?`<i>${esc(p.name)} crowd</i>`:'',g===best?`<i>${esc(w.short)}’s style</i>`:'',g===foeBest?`<i>${esc(f.short)}’s style</i>`:''].join('');
 const opts=(name,obj,val)=>Object.entries(obj).map(([k,o])=>`<button class="opt" data-plan="${name}" data-val="${k}" aria-pressed="${val===k}"><b>${esc(o.name)}</b><span>${esc(o.blurb)}</span>${name==='game'?`<span class="fits">${fits(k)}</span>`:''}</button>`).join('');
 const finishLine={win_clean:`${w.short} wins clean`,win_dirty:`${w.short} wins dirty`,lose_protected:`${w.short} loses, protected`,lose_clean:`${w.short} loses clean`}[c.finish];
 const stam=Math.round(100-w.fatigue*.7);
 const tape=`<div class="well tape"><div class="side">${face('wrestler',w.id,w.name,'portrait x2')}<div class="nm">${esc(w.short)}</div></div><div class="cmp">${cmpRow('Ring',w.ring,f.ring)}${cmpRow('Psych',w.psych,f.psych)}${cmpRow('Safety',w.safe,f.safe)}${cmpRow('Heat',w.heat,f.heat)}${cmpRow('Pro',w.pro,f.pro)}${cmpRow('Stamina',stam,92)}</div><div class="side">${face('wrestler',f.id,f.name,'portrait x2')}<div class="nm them">${esc(f.short)}</div></div></div>`;
 const road=Mx.scout(w,f,P.game,Math.max(c.feudHeat||0,G.feud(w.id,f.id)?.heat||0));
 const mind=OfficeMemory.context(w.id,f.id);
 const contract=`<div style="font:32px/1 var(--jersey);color:var(--blood)">${esc(finishLine)}</div><p class="dim" style="margin:4px 0 8px">The finish is in the contract.</p><dl class="kv"><dt>Slot</dt><dd>${esc(D.SLOTS[c.slot].name)}, ${c.minutes} minutes</dd><dt>Purse</dt><dd>${money(c.purse)}</dd>${c.tag?`<dt>Billing</dt><dd>${esc(c.tag)}</dd>`:''}<dt>Opponent</dt><dd>${esc(f.name)}, ${esc(f.style.toLowerCase())}. Finisher: ${esc(f.finisher)}.</dd></dl><p style="margin-top:8px">${esc(fnotes.join(' ')||'A steady, professional opponent.')}</p>${warn.length?`<ul class="warnings">${warn.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p class="good">${esc(w.short)} is fit and ready. Morale ${w.morale}.</p>`}<div class="well" style="margin-top:10px"><b>Road agent's scouting</b><p style="margin:5px 0">${esc(road.brief)}</p><p class="dim">${esc(road.advice)}</p>${mind.recall?`<p style="margin-top:6px"><b>What they remember:</b> ${esc(mind.recall)}</p><p class="dim">Trust in your judgement: ${mind.trust}/100.</p>`:''}</div>`;
 const plan=`<div class="prep-context"><b>${esc(w.short)} v ${esc(f.short)}</b><span>${esc(finishLine)} · ${esc(D.SLOTS[c.slot].name)} · ${c.minutes} minutes</span></div><div class="planset"><fieldset class="decide"><legend>What is the match built on?</legend><div class="opts plan-choices" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${opts('game',D.PLANS,P.game)}</div></fieldset><fieldset class="decide"><legend>Who calls it?</legend><div class="opts">${opts('leash',D.LEASH,P.leash)}</div></fieldset><fieldset class="decide"><legend>Last word at the curtain</legend><div class="opts">${opts('talk',D.TALKS,P.talk)}</div></fieldset></div>`;

 $('#tv').innerHTML=`${strip(c,'tonight')}<div class="stage screen s-prep">${win('Tale of the tape',tape,{area:'tape',h:'h3',cls:'quiet',body:'tight'})}${win('The contract',contract,{area:'contract',h:'h3'})}${win('Game plan',plan,{area:'plan',h:'h3'})}</div><div class="tv-foot"><span class="dim">Next: the wrestlers agree a match sheet before microphone time.</span><button class="btn go" data-tv="meeting">Meet the wrestlers</button></div>`;
 night.stage='prep';persistNight();
}

  '<button class="opt" data-sheetmode="'+id+'" aria-pressed="'+(sh.method===id)+'"><b>'+esc(mode.label)+'</b><span>'+esc(mode.desc)+'</span></button>').join('');

   .map(([id,title,hint])=>'<button class="choice" data-sheetvote="'+id+'"><b>'+esc(title)+'</b><span>'+esc(hint)+'</span></button>').join('')+'</div>';
 const beats=sh.nodes.map((b,i)=>'<li style="margin-bottom:9px"><b>'+esc((i+1)+'. '+b.title)+'</b><span class="dim" style="display:block">'+

  '<h3 class="section-h">In their own words</h3>'+spoken,{h:'h3',keep:'meeting'});

function showPromos(){
 const c=current();if(!c)return endNight();

 if(d.decide)return decideNow(d.decide);
 if(d.speed!==undefined){night.speed=d.speed;document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.speed===night.speed));if(!night.paused)schedule(50);return}
 if(t.hasAttribute('data-pause')){night.paused=!night.paused;updateLive();if(!night.paused)schedule(100);return}
});
document.addEventListener('change',e=>{
 const t=e.target,d=t.dataset;
 if(d.train){G.setTraining(d.train,t.value);render();toast(`${G.W(d.train).short}: ${D.TRAINING[t.value].name.toLowerCase()} this week.`);return}
 if(d.intensity){G.setIntensity(d.intensity,t.value);render();toast(`${G.W(d.intensity).short}: ${G.INTENSITY[t.value].name}, ${money(G.trainingCost(G.W(d.intensity)))} a week.`);return}
 if(d.pick){pick[d.pick]=t.value;render();return}
});
document.addEventListener('mouseover',e=>{const b=e.target.closest('[data-hint]');if(b&&$('#lHint'))$('#lHint').textContent=b.dataset.hint});
document.addEventListener('focusin',e=>{const b=e.target.closest('[data-hint]');if(b&&$('#lHint'))$('#lHint').textContent=b.dataset.hint});
document.addEventListener('keydown',e=>{
 if(night?.M&&!$('#tv').hidden){
  const box=$('#decision');if(box&&!box.hidden)return;
  if(e.key===' '){e.preventDefault();night.paused=!night.paused;updateLive();if(!night.paused)schedule(100);return}
  const n=+e.key;if(n>=1&&n<=6){doCall(Object.keys(Mx.CALLS)[n-1]);return}
 }
});

/* ---------- boot ---------- */
window.OfficeUI={get night(){return night},go};
window.addEventListener('DOMContentLoaded',()=>{
 const d=$('#modal');d.addEventListener('close',()=>{
  const oid=d.dataset.talkoid;if(oid&&S()){const o=S().offers.find(x=>x.id===oid);if(o?.talk?.step==='start'){o.talk=null;G.save();}}
  delete d.dataset.talkoid;if(S()&&!$('#app').hidden)render();
 });
 if(G.hasSave())$('#loadBtn').hidden=false;
 $('#title').hidden=false;
});
})();
</script>
</body>
</html>
