<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17171c">
    <meta name="description" content="Create a rikishi and manage their sumo career from Jonokuchi to Yokozuna.">
    <title>Dohyō — Sumo Career</title>
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-content">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i></span>
          <div><strong>DOHYŌ</strong><span>SUMO CAREER</span></div>
        </div>
        <div class="top-actions">
          <span id="save-status" class="save-status"></span>
          <button id="sound-toggle" class="quiet-button" type="button" aria-pressed="true">Sound on</button>
        </div>
      </div>
    </header>

    <main class="shell">
      <div class="masthead">
        <div>
          <p class="kicker" id="page-kicker"></p>
          <h1 id="page-title" tabindex="-1"></h1>
          <p class="page-description" id="page-description"></p>
        </div>
        <ol class="steps" aria-label="Career workflow">
          <li data-screen="creator"><span>01</span> Create</li>
          <li data-screen="booking"><span>02</span> Prepare</li>
          <li data-screen="broadcast"><span>03</span> Watch</li>
          <li data-screen="report"><span>04</span> Review</li>
        </ol>
      </div>

      <div class="layout">
        <section class="monitor" aria-label="Three-dimensional arena and commentary">
          <div class="viewport">
            <canvas id="arena" aria-hidden="true"></canvas>
            <p class="viewport-fallback" id="viewport-fallback" hidden>The 3D arena needs WebGL. Bout commentary is available below.</p>
            <div class="view-header">
              <span class="view-tag"><i aria-hidden="true"></i><span id="view-mode">STABLE CAM</span></span>
              <span class="view-location">DOHYŌ / HALL 01</span>
            </div>
            <div class="lower-third">
              <p id="view-label"></p>
              <div id="view-title"></div>
              <p id="view-subtitle"></p>
            </div>
          </div>
          <div class="monitor-footer">
            <div class="monitor-line">
              <span class="monitor-index" aria-hidden="true">⦿</span>
              <p id="commentary" role="status" aria-live="polite"></p>
            </div>
            <progress id="bout-progress" max="1" value="0" aria-label="Broadcast progress" hidden></progress>
          </div>
        </section>
        <section class="panel" id="panel" aria-label="Career controls"></section>
      </div>
      <footer class="page-footer">
        <span>DOHYŌ <b>•</b> STABLE CAREER</span>
        <span>Fictional rikishi and condensed three-bout meets</span>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
