<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Office v2.3 — Territory Pyramid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=VT323&display=swap" rel="stylesheet">
<style>:root{
 --bg:#E4E8F2;--surface:#F7F8FC;--surface-2:#ECEFF7;--line:#C3CBE0;--ink:#121A38;--ink-2:#46527C;--ink-3:#6A769E;
 --accent:#1D3B9A;--accent-ink:#fff;--good:#17703F;--bad:#B3302A;--crowd:#0B7385;--cta-bg:#142257;--cta-ink:#FFD447;--sel:#DCE3F7;
 --tv-bg:#0A1230;--tv-panel:#101B44;--tv-line:#24346B;--tv-ink:#E8ECF7;--tv-dim:#8C98C4;--tv-hi:#FFD447;--tv-crowd:#72E0EE;--tv-bad:#FF7A6E;--tv-good:#6BD99A;--tv-you:#FFD447;--tv-them:#9DB0E8;
 --ui:'Archivo','Arial Narrow',Arial,sans-serif;--tv:'VT323','Courier New',monospace;
 color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0E1631;--surface:#151F45;--surface-2:#1A2652;--line:#2A3A73;--ink:#E8ECF7;--ink-2:#A3AED3;--ink-3:#7584B4;
 --accent:#FFD447;--accent-ink:#0E1631;--good:#6BD99A;--bad:#FF7A6E;--crowd:#72E0EE;--cta-bg:#FFD447;--cta-ink:#0E1631;--sel:#22306A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1631;--surface:#151F45;--surface-2:#1A2652;--line:#2A3A73;--ink:#E8ECF7;--ink-2:#A3AED3;--ink-3:#7584B4;
 --accent:#FFD447;--accent-ink:#0E1631;--good:#6BD99A;--bad:#FF7A6E;--crowd:#72E0EE;--cta-bg:#FFD447;--cta-ink:#0E1631;--sel:#22306A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--ui);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-stretch:75%;font-weight:800;line-height:1;margin:0;letter-spacing:-.005em}
p{margin:0 0 .6em}
.dim{color:var(--ink-2)}.faint{color:var(--ink-3)}.good{color:var(--good)}.bad{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;padding:10px clamp(12px,3vw,28px);background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.brand{display:flex;flex-direction:column;line-height:1;margin-right:auto}
.brand b{font-size:26px;font-stretch:62%;font-weight:900;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--ink-3);margin-top:3px}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.stat small{font-size:12px;color:var(--ink-3)}
.stat strong{font-size:20px;font-stretch:80%;font-weight:700}
.cta{background:var(--cta-bg);color:var(--cta-ink);border:0;padding:12px 22px;font-weight:800;font-stretch:80%;font-size:19px;min-width:170px;border-radius:2px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.cta:hover{filter:brightness(1.08)}
.cta small{display:block;font-size:12px;font-weight:600;opacity:.8;font-stretch:100%}
.tabs{display:flex;gap:2px;padding:0 clamp(12px,3vw,28px);background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:11px 16px 9px;font-weight:700;font-stretch:85%;font-size:16px;color:var(--ink-2);white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .pill{display:inline-block;min-width:20px;margin-left:6px;padding:1px 6px;border-radius:9px;background:var(--bad);color:#fff;font-size:12px;font-stretch:100%;text-align:center}
.tab .pill.soft{background:var(--surface-2);color:var(--ink-2)}
main{max-width:1200px;margin:0 auto;padding:22px clamp(12px,3vw,28px) 60px}
.section{margin-bottom:28px}
.section>h2{font-size:24px;margin-bottom:4px}
.section>.lede{color:var(--ink-2);margin-bottom:12px;max-width:68ch}

/* ---------- generic ---------- */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:2px;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:none;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:7px 4px}
.btn.danger{color:var(--bad)}
select{border:1px solid var(--line);background:var(--surface);padding:6px 8px;border-radius:2px;max-width:100%}
.meter{display:inline-block;width:64px;height:7px;background:var(--surface-2);border:1px solid var(--line);vertical-align:middle;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ink-2)}
.meter.hot i{background:var(--good)}.meter.warn i{background:#D99A1E}.meter.danger i{background:var(--bad)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:2px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag.win{color:var(--good);border-color:currentColor;background:none}
.tag.lose{color:var(--bad);border-color:currentColor;background:none}
.tag.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{padding:26px;border:1px dashed var(--line);color:var(--ink-2);text-align:center}
.portrait{image-rendering:pixelated;width:36px;height:45px;border:1px solid var(--line);background:var(--surface-2);flex:none}

/* ---------- inbox ---------- */
.inbox{display:grid;grid-template-columns:minmax(260px,360px) 1fr;border:1px solid var(--line);background:var(--surface);min-height:420px}
.msglist{list-style:none;margin:0;padding:0;border-right:1px solid var(--line);max-height:70vh;overflow:auto}
.msglist button{display:grid;grid-template-columns:10px 1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px}
.msglist button[aria-current="true"]{background:var(--sel)}
.msglist .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
.msglist .unread .dot{background:var(--accent)}
.msglist .need .dot{background:var(--bad)}
.msglist .from{font-size:13px;color:var(--ink-2)}
.msglist .subj{grid-column:2/4;font-weight:600}
.msglist .unread .subj{font-weight:800}
.msglist .wk{font-size:12px;color:var(--ink-3)}
.letter{padding:22px 26px;max-width:72ch}
.letter h2{font-size:30px;margin:4px 0 14px}
.letter .meta{font-size:13px;color:var(--ink-3)}
.choices{display:grid;gap:8px;margin-top:18px}
.choice{display:grid;grid-template-columns:1fr;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);border-radius:2px}
.choice:hover{border-color:var(--accent)}
.choice b{font-size:16px}
.choice span{font-size:14px;color:var(--ink-2)}
.outcome{margin-top:16px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface-2)}

/* ---------- tables ---------- */
.table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line)}
.table th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table td.n,.table th.n{text-align:right}
.who{display:flex;align-items:center;gap:10px;min-width:180px}
.who b{display:block;font-size:16px;font-stretch:85%}
.who small{color:var(--ink-3);font-size:12px}
.rowlink{background:none;border:0;padding:0;text-align:left}
.rowlink:hover b{text-decoration:underline}
.detail td{background:var(--surface-2)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding:8px 2px}
.detail-grid h3{font-size:16px;margin-bottom:6px}

/* ---------- bookings ---------- */
.ledger{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;padding:12px 16px;background:var(--surface);border:1px solid var(--line);margin-bottom:18px}
.ledger strong{font-size:22px;font-stretch:80%}
.offers{display:grid;gap:8px}
.offer{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(190px,1.4fr) minmax(250px,1.6fr);gap:14px 20px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line)}
.offer h3{font-size:20px}
.offer .terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.offer .act{display:grid;gap:8px}
.offer .act .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.offer .purse{font-size:24px;font-weight:800;font-stretch:80%}
.fit{font-size:13px}
.haggle{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:13px}
.haggle .btn{padding:4px 8px;font-size:13px}
.card-list{display:grid;gap:6px}
.booked{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent)}
.booked b{font-size:17px;font-stretch:85%}

/* ---------- records ---------- */
.goals{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.goals li{padding:12px 14px;background:var(--surface);border:1px solid var(--line)}
.goals li.done{border-color:var(--good)}
.goals li.done::before{content:"✓ ";color:var(--good);font-weight:800}
.stars{color:var(--accent);letter-spacing:.04em;white-space:nowrap}

/* ---------- title ---------- */
.title{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--tv-bg);color:var(--tv-ink);padding:24px}
.title[hidden]{display:none}
.title .inner{max-width:640px;width:100%}
.title .teletext{font:22px/1 var(--tv);color:var(--tv-bg);background:var(--tv-hi);display:inline-block;padding:4px 10px;margin-bottom:22px}
.title h1{font-size:clamp(64px,14vw,150px);font-stretch:62%;font-weight:900;line-height:.82;letter-spacing:-.01em}
.title p{font:24px/1.25 var(--tv);color:var(--tv-dim);margin:22px 0 30px;max-width:30ch}
.title .row{display:flex;gap:12px;flex-wrap:wrap}
.title .cta{background:var(--tv-hi);color:var(--tv-bg)}
.title .alt{background:none;border:1px solid var(--tv-line);color:var(--tv-ink);padding:12px 20px;font-weight:700;font-stretch:80%;font-size:18px}
.title .note{font:18px var(--tv);color:var(--tv-dim);margin-top:28px}

/* ---------- toast + dialog ---------- */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:2px;font-weight:600;max-width:min(560px,92vw);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.show{opacity:1}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;max-width:min(720px,94vw);width:100%;border-radius:2px}
dialog::backdrop{background:rgba(5,10,30,.6)}
dialog .dlg{padding:20px 22px;max-height:80vh;overflow:auto}
dialog h2{font-size:26px;margin-bottom:10px}
dialog .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 22px;border-top:1px solid var(--line)}

/* ---------- the TV: match night ---------- */
.tv{position:fixed;inset:0;z-index:20;background:var(--tv-bg);color:var(--tv-ink);overflow:auto;display:flex;flex-direction:column}
.tv[hidden]{display:none}
.tv .strip{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:8px clamp(12px,3vw,28px);background:var(--tv-hi);color:var(--tv-bg);font:22px/1 var(--tv)}
.tv .strip b{font-weight:400}
.tv .wrap{width:100%;max-width:1100px;margin:0 auto;padding:18px clamp(12px,3vw,28px) 28px;flex:1;display:flex;flex-direction:column}
.tv .btn{background:var(--tv-panel);border-color:var(--tv-line);color:var(--tv-ink)}
.tv .btn:hover:not(:disabled){border-color:var(--tv-dim)}
.tv .go{background:var(--tv-hi);color:var(--tv-bg);border:0;padding:13px 26px;font-weight:800;font-stretch:80%;font-size:20px;border-radius:2px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin:6px 0 16px}
.vs .side{display:flex;align-items:center;gap:14px}
.vs .side.them{flex-direction:row-reverse;text-align:right}
.vs img{width:72px;height:90px;image-rendering:pixelated;border:1px solid var(--tv-line);background:var(--tv-panel)}
.vs h2{font-size:clamp(26px,4vw,44px);font-stretch:62%;font-weight:900}
.vs small{display:block;font:20px var(--tv);color:var(--tv-dim)}
.vs .v{font:40px var(--tv);color:var(--tv-dim)}
.contract{font:24px/1.2 var(--tv);color:var(--tv-ink);padding:10px 14px;border:1px solid var(--tv-line);background:var(--tv-panel);margin-bottom:16px}
.contract em{font-style:normal;color:var(--tv-hi)}
.scout{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.scout div{padding:10px 14px;border-left:2px solid var(--tv-line);font-size:15px;color:var(--tv-dim)}
.scout b{color:var(--tv-ink)}
.scout .warn{color:var(--tv-bad)}
.decide{border:0;margin:0 0 18px;padding:0}
.decide legend{font-size:20px;font-weight:800;font-stretch:80%;margin-bottom:8px;padding:0}
.decide .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.opt{position:relative;text-align:left;border:1px solid var(--tv-line);background:var(--tv-panel);color:var(--tv-ink);padding:10px 12px;border-radius:2px;display:flex;flex-direction:column;gap:3px}
.opt b{font-size:16px}
.opt span{font-size:13px;color:var(--tv-dim)}
.opt[aria-pressed="true"]{border-color:var(--tv-hi);box-shadow:inset 0 0 0 1px var(--tv-hi)}
.opt .fits{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.opt .fits i{font-style:normal;font-size:12px;padding:0 6px;border:1px solid var(--tv-good);color:var(--tv-good)}
.opt .fits i.no{border-color:var(--tv-bad);color:var(--tv-bad)}
.prep-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.prep-foot .dim{color:var(--tv-dim)}

/* live */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.score .side{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.score .side.them{grid-template-columns:1fr auto;text-align:right}
.score .side.them img{grid-column:2;grid-row:1/3}
.score img{width:52px;height:65px;image-rendering:pixelated;border:1px solid var(--tv-line);grid-row:1/3}
.score h2{font-size:clamp(22px,3.4vw,34px);font-stretch:62%;font-weight:900}
.score .you h2{color:var(--tv-you)}
.stam{height:6px;background:var(--tv-panel);border:1px solid var(--tv-line);position:relative}
.stam i{position:absolute;top:0;bottom:0;left:0;background:var(--tv-good);transition:width .4s}
.them .stam i{left:auto;right:0}
.stam.low i{background:var(--tv-bad)}
.score .mid{text-align:center;min-width:160px}
.score .live-stars{font:42px/1 var(--tv);color:var(--tv-hi);letter-spacing:.05em;min-height:42px}
.score .clock{font:34px/1 var(--tv)}
.score .phase{font:20px var(--tv);color:var(--tv-dim)}
.mom{margin:14px 0 4px;height:8px;display:flex;background:var(--tv-them)}
.mom i{display:block;background:var(--tv-you);transition:width .5s}
.momlab{display:flex;justify-content:space-between;font:18px var(--tv);color:var(--tv-dim)}
.feed{flex:1;display:flex;flex-direction:column;margin:12px 0;min-height:260px}
.now{min-height:3.2em;display:flex;align-items:center;gap:16px;font:clamp(28px,4.2vw,44px)/1.1 var(--tv);padding:16px 0;border-top:1px solid var(--tv-line);border-bottom:1px solid var(--tv-line)}
.now .t{color:var(--tv-dim);font-size:.6em;flex:none;width:3.4em}
.now.big{color:var(--tv-hi)}
.now.count{justify-content:center;font-size:clamp(60px,11vw,120px);color:var(--tv-hi)}
.now.count .t{display:none}
.now.crowd{color:var(--tv-crowd)}.now.bad,.now.alert{color:var(--tv-bad)}.now.agent,.now.you{color:var(--tv-dim)}
.now.rating{color:var(--tv-hi);justify-content:center}
.now .tx{animation:land .18s ease-out}
@keyframes land{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.past{list-style:none;margin:10px 0 0;padding:0;font:22px/1.25 var(--tv);color:var(--tv-dim);overflow:hidden;max-height:11.5em}
.past li{display:flex;gap:16px;padding:2px 0}
.past li .t{flex:none;width:3.4em;opacity:.7}
.past li.crowd{color:#5BAFBC}.past li.bad,.past li.alert{color:#C46A62}.past li.big{color:#CDB453}.past li.you{color:#B9C3E6}
.past li:nth-child(n+5){opacity:.6}.past li:nth-child(n+7){opacity:.4}
.bench{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;padding-top:14px;border-top:1px solid var(--tv-line)}
.gauge{margin-bottom:10px}
.gauge label{display:flex;justify-content:space-between;font:20px var(--tv);color:var(--tv-dim)}
.gauge label b{font-weight:400;color:var(--tv-ink)}
.gauge label b.warnv{color:var(--tv-bad)}
.gbar{height:10px;background:var(--tv-panel);border:1px solid var(--tv-line);position:relative}
.gbar i{position:absolute;inset:0 auto 0 0;background:var(--tv-crowd);transition:width .4s}
.callsleft{font:20px var(--tv);color:var(--tv-dim)}
.callsleft span{color:var(--tv-hi);letter-spacing:.2em}
.calls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.call{text-align:left;padding:10px 12px;border:1px solid var(--tv-line);background:var(--tv-panel);color:var(--tv-ink);border-radius:2px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:baseline}
.call kbd{font:16px var(--tv);color:var(--tv-dim);border:1px solid var(--tv-line);padding:0 5px}
.call:hover:not(:disabled){border-color:var(--tv-hi)}
.callhint{font:19px/1.2 var(--tv);color:var(--tv-dim);min-height:1.3em;margin-top:8px}
.speed{display:flex;gap:4px;align-items:center;margin-top:10px;flex-wrap:wrap}
.speed button{background:none;border:1px solid var(--tv-line);color:var(--tv-dim);padding:5px 10px;font:18px/1 var(--tv)}
.speed button[aria-pressed="true"]{color:var(--tv-bg);background:var(--tv-ink);border-color:var(--tv-ink)}
.speed .gap{flex:1}
.decision{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(4,8,24,.72);padding:18px}
.decision[hidden]{display:none}
.decision .box{width:min(620px,100%);background:var(--tv-bg);border:2px solid var(--tv-bad);padding:20px 22px}
.decision .flash{font:22px var(--tv);color:var(--tv-bg);background:var(--tv-bad);display:inline-block;padding:2px 8px;margin-bottom:10px}
.decision h2{font-size:36px;font-stretch:62%;font-weight:900;margin-bottom:8px}
.decision p{color:var(--tv-dim);font-size:16px}
.decision .opts{display:grid;gap:8px;margin-top:14px}
/* result */
.final{text-align:center;padding:10px 0 18px}
.final .bigstars{font:clamp(64px,12vw,120px)/1 var(--tv);color:var(--tv-hi);letter-spacing:.04em}
.final .verdict{font:28px var(--tv);color:var(--tv-dim)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--tv-line);border:1px solid var(--tv-line);margin-bottom:18px}
.facts div{background:var(--tv-panel);padding:10px 12px}
.facts small{display:block;font:18px var(--tv);color:var(--tv-dim)}
.facts b{font:30px/1 var(--tv);font-weight:400}
.cons{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:4px}
.cons li{padding:7px 12px;border-left:3px solid var(--tv-line);background:var(--tv-panel)}

 say(M,`${M.f.name} comes out first. ${fh>=60?'Boos rain down.':'A smattering of jeers.'}`,'play',{at:0});
 const pop=wh<30?'Polite applause. Not many know the name yet.':wh<55?'A decent reaction.':wh<75?`A big pop for ${M.w.short}.`:`The roof comes off for ${M.w.short}!`;
 say(M,`Here comes ${M.w.name}. ${pop}`,wh>=75?'crowd':'play',{at:0,big:wh>=75});
 if(M.o.blowoff)say(M,'This is the end of the road for these two. Everyone here knows it.','story',{at:0});
 else if((M.o.feudHeat||0)>=35)say(M,'Bad blood here. These two have history.','story',{at:0});
 if(M.reaction)say(M,M.reaction,'agent',{at:0});
 const prepared=Object.entries(M.prep).filter(([skill,v])=>v>=1.5).sort((a,b)=>b[1]-a[1])[0];
 if(prepared){const lines={ring:`Road agent: ${M.w.short}'s ring drills are evident in the opening exchanges.`,psych:`Road agent: ${M.w.short} looks composed after working on match psychology.`,safe:`Road agent: ${M.w.short} has drilled the safety sequences; they are less likely to go wrong.`,mic:`Road agent: ${M.w.short}'s recent promo work has warmed up this crowd.`};say(M,lines[prepared[0]],'agent',{at:0});}
 say(M,`Ding ding. We’re under way at ${M.p.venue}.`,'bell',{at:0,big:true});
 M.stage='live';
}
function tick(M){
 M.t+=10;const frac=M.t/M.len,ph=phaseFor(frac),w=M.w,f=M.f,plan=M.plan;
 if(!M.phase||M.phase.id!==ph.id){M.phase=ph;onPhase(M);if(M.decision)return;}
 // momentum
 const target=MOM_TARGET[ph.id];M.mom+=(target-M.mom)*.25+(M.r()*30-15);M.mom=clamp(M.mom,-100,100);
 // stamina
 const mode=M.mode?.type;
 const drain=.55*plan.drain*(mode==='pickup'?1.7:mode==='slow'?.3:1)*(1+w.fatigue/250)*(M.workingHurt?1.5:1);
 M.wSt=clamp(M.wSt-drain+(mode==='slow'?1.6:0));M.fSt=clamp(M.fSt-.5*plan.drain+(mode==='slow'?1.2:0));
 // quality of this ten seconds
 const sk=(w.ring*plan.w.ring+w.psych*plan.w.psych)*(.55+.45*M.wSt/100);
 const sf=(f.ring*plan.w.ring+f.psych*plan.w.psych)*(.55+.45*M.fSt/100);
 let q=18+(sk*.55+sf*.45)*.6+M.fit+(plan.qual||0)+(M.crowd-50)*.1+(M.talk==='fire'?2:0);
 if(M.leash==='free')q+=(M.r()*24-12)+(w.psych-62)*.18;else q+=M.r()*16-8;
 if(M.offScript==='showboat')q-=4;if(M.offScript==='audible')q+=(w.psych-65)/3;
 if(mode==='slow')q-=M.crowd<45?6:3;if(mode==='pickup')q+=M.wSt>45?3:-5;if(mode==='crowd')q-=3;
 if(M.workingHurt)q-=6;if(M.stiff==='protect')q-=4;
 if(M.wSt<25)q-=6;
 q=clamp(q,5,100);M.qSum+=q;M.qN++;
 // crowd
 let dc=(q-55)/22*CROWD_MUL[ph.id]*plan.crowd*(ph.id==='stretch'?plan.late:1);
 if(mode==='crowd')dc+=1.1*(w.mic/80);if(mode==='pickup')dc+=M.wSt>40?.6:-.4;if(mode==='slow')dc-=.5;
 if(M.offScript==='showboat')dc+=.4;
 dc-=(M.crowd-55)*.02;
 M.crowd=clamp(M.crowd+dc);
 // mode countdown
 if(M.mode){M.mode.ticks--;if(M.mode.ticks<=0)M.mode=null;}
 // the injured wrestler can make things worse
 if(M.workingHurt&&M.r()<.04&&M.injury<4){M.injury++;say(M,`${w.short} winces again. That’s getting worse.`,'agent');}
 // spots
 const spotP=plan.spotRate*SPOT_MUL[ph.id]*(mode==='pickup'?1.6:mode==='slow'?.2:1)*(M.offScript==='showboat'?1.5:1);
 let spoke=false;
 if(M.r()<spotP){spot(M,false);spoke=true;}
 // near falls
 if(M.nearfallAt.length&&frac>=M.nearfallAt[0]){M.nearfallAt.shift();nearfall(M);spoke=true;}
 // crowd bands
 crowdBand(M);
 // producer hints
 if(!M.hints.dead&&M.crowd<33&&frac>.3){M.hints.dead=1;say(M,`In your ear: they’re dying out here. Change something.`,'agent');}
 if(!M.hints.tired&&M.wSt<30){M.hints.tired=1;say(M,`In your ear: ${w.short} is blown up. Slow it down or take it home.`,'agent');}
 // incidents
 incidents(M,frac);
 if(M.decision)return;
 // play-by-play
 if(!spoke&&M.r()<.42)playByPlay(M);
 M.crowdSum+=M.crowd;M.crowdPeak=Math.max(M.crowdPeak,M.crowd);
 if(M.t>=M.len){M.stage='finish';}
}
function onPhase(M){
 const ph=M.phase,w=M.w;
 if(M.leash==='script'&&ph.id!=='open'){
  M.scriptChecks++;
  if(M.r()*100<M.comply){M.scriptHits++;M.offScript=null;}
  else{M.offScript=w.ego>=65?'showboat':'audible';
   say(M,M.offScript==='showboat'?`${w.short} has gone off the sheet, playing to the crowd instead of the plan.`:`${w.short} is calling audibles. This wasn’t the plan.`,'agent');}
 }
 if(ph.id==='heat'&&!M.offered.stiff&&M.f.ego>=68&&M.r()<(M.f.ego-55)/60){M.offered.stiff=1;decide(M,'stiff');return;}
 if(ph.id==='stretch'){
  if(M.o.flags?.dive){M.o.flags.dive=false;dive(M);}
  if(!M.offered.double&&M.o.finish.startsWith('lose')&&M.crowd>=82&&w.heat>=55&&M.outcome==='booked'){M.offered.double=1;if(M.r()<.5)decide(M,'double');}
 }
}
function incidents(M,frac){
 if(M.decision)return;
 if(M.p.tv&&!M.offered.time&&frac>=.45&&frac<.62){M.offered.time=1;if(M.r()<.45&&M.len-M.t>300)decide(M,'time');}
}
function crowdBand(M){
 const c=M.crowd,T=[35,55,70,85];let band=M.lastCrowdBand??T.filter(x=>c>=x).length;
 if(M.lastCrowdBand===null){M.lastCrowdBand=band;return}
 while(band<4&&c>=T[band]+2)band++;while(band>0&&c<T[band-1]-3)band--;
 if(band===M.lastCrowdBand)return;
 if(band>M.lastCrowdBand){
  const t=[null,`A murmur round ${M.p.venue}. They’re starting to pay attention.`,'The place is warming up now.','Loud now. They’re stamping their feet.','THIS PLACE IS COMING UNSTUCK!'][band];
  say(M,t,'crowd',{big:band>=3});
 }else if(band<M.lastCrowdBand){
  const t=['You could hear a pin drop. They’ve gone quiet.','The noise has dropped right off.','They’ve cooled a little.','Still loud, but not quite what it was.'][band];
  say(M,t,'crowd');
 }
 M.lastCrowdBand=band;
}
function actors(M){const yours=M.mom>=0;return yours?{A:M.w,D:M.f}:{A:M.f,D:M.w}}
function playByPlay(M){
 const {A,D:Df}=actors(M);
 if(Math.abs(M.mom)<12&&M.r()<.5)return say(M,fresh(M,NEUTRAL));
 let pool=LINES[M.phase.id];const ph=M.phase.id;
 if((ph==='shine'||ph==='comeback')&&A===M.f)pool=LINES.heat;
 if(ph==='heat'&&A===M.w)pool=HOPE;
 const line=fresh(M,pool);
 say(M,fill(M,line,{A:A.short,D:Df.short,move:pick(M,A),fin:the(A.finisher),part:rnd(M,PARTS)}));
}
function spot(M,big,forced){
 const {A,D:Df}=forced?{A:M.w,D:M.f}:actors(M);
 const yours=A===M.w,st=yours?M.wSt:M.fSt;
 const move=rnd(M,D.SPOTS[A.style]||D.SPOTS.Story);
 let botchP=(.03+(100-A.safe)*.0018+(100-st)*.0015)*M.riskMul*(big?1.5:1);
 if(A.ring>=80)botchP*=.8;
 M.spots++;
 if(big||M.r()<.45)say(M,`${A.short} ${big?'heads for the top rope':'sets up'}…`,'play',{pause:1});
 if(M.r()<botchP){
  M.botches++;M.bonus-=big?30:20;M.crowd=clamp(M.crowd-(big?9:6));
  say(M,`${move.charAt(0).toUpperCase()+move.slice(1)}… and it’s gone wrong. That looked nasty.`,'bad',{big:true});
  // who gets hurt: the taker or the one who went for it
  const hurtYours=yours?M.r()<.55:M.r()<.45;
  const injP=(.1+(100-(yours?M.w.safe:M.f.safe))/350)*(big?1.4:1);
  if(M.r()<injP){
   if(hurtYours&&!M.injury){M.injury=1+(M.r()<.4?1:0)+(big&&M.r()<.4?1:0);M.injuryPart=rnd(M,PARTS);decide(M,'injury');}
   else if(!hurtYours&&!M.foeHurt){M.foeHurt=true;say(M,`${M.f.short} is holding the ${rnd(M,PARTS)}. The referee leans in.`,'agent');M.fSt=clamp(M.fSt-25);}
  }
 }else{
  M.spotHits++;const pop=(big?7:3)+M.r()*(big?7:4);M.crowd=clamp(M.crowd+pop*M.plan.crowd);M.bonus+=big?18:10;
  say(M,`${move.charAt(0).toUpperCase()+move.slice(1)} from ${A.short}!${M.crowd>=70?' The crowd come up out of their seats!':''}`,M.crowd>=70?'crowd':'play',{big:big||M.crowd>=75});
  if(yours)M.wSt=clamp(M.wSt-(big?7:3));
 }
}
function dive(M){
 say(M,`${M.w.short} is climbing… not the turnbuckle. The balcony.`,'play',{pause:2,big:true});
 const botchP=(.12+(100-M.w.safe)*.004)*M.riskMul;
 M.spots++;
 if(M.r()<botchP){M.botches++;M.bonus-=35;M.crowd=clamp(M.crowd-4);say(M,`${M.w.short} jumps… and comes up short. The front row scatters.`,'bad',{big:true});
  if(!M.injury&&M.r()<.55){M.injury=2+(M.r()<.4?1:0);M.injuryPart=rnd(M,PARTS);decide(M,'injury');}}
 else{M.spotHits++;M.bonus+=30;M.crowd=clamp(M.crowd+16);M.adj.heat+=4;say(M,`${M.w.short} FLIES off the balcony and wipes out ${M.f.short}! Phones are out everywhere!`,'crowd',{big:true});}
}
function nearfall(M){
 const yoursFirst=!M.o.finish.startsWith('win');
 const yours=M.nearfalls%2===0?!yoursFirst:yoursFirst;
 const A=yours?M.w:M.f,Df=yours?M.f:M.w;
 const late=M.nearfallAt.length===0&&M.crowd>=68;
 const pop=3+M.crowd*.05*(late?1.4:1);
 if(late&&A.sub){
  say(M,`${A.short} locks in ${the(A.finisher)}!`,'play',{big:true,pause:1});
  say(M,`${Df.short} is fading… reaching for the ropes…`,'play',{pause:2});
  M.crowd=clamp(M.crowd+pop);
  say(M,`ROPE BREAK! ${Df.short} SURVIVES ${THE(A.finisher)}!`,'crowd',{big:true});
 }else{
  const move=late?`${the(A.finisher)}`:rnd(M,D.SPOTS[A.style]||D.SPOTS.Story).replace(/^a /,'a ');
  say(M,`${A.short} hits ${move}!`,'play',{big:true,pause:1});
  say(M,'Cover!','count',{pause:1});
  say(M,'ONE!','count',{pause:1,big:true});
  say(M,'TWO!','count',{pause:2,big:true});
  M.crowd=clamp(M.crowd+pop);
  say(M,late?`NO! ${Df.short} KICKED OUT OF ${THE(A.finisher)}!`:`Kick out! ${Df.short} survives!`,'crowd',{big:true});
 }
 M.nearfalls++;M.bonus+=late?8:4;
}

/* ---- ringside calls ---- */
const CALLS={
 slow:{name:'Slow it down',hint:'Rest hold. Recover stamina; the crowd may cool.'},
 pickup:{name:'Pick it up',hint:'Faster pace. Crowd up if they have the legs.'},
 big:{name:'Hit the big spot',hint:'One big move now. Huge pop or a nasty botch.'},
 crowd:{name:'Work the crowd',hint:'Play to the seats. Builds noise, stalls the match.'},
 home:{name:'Take it home',hint:'Go to the finish now. Early means a shorter, weaker match.'},
 sheet:{name:'Back to the sheet',hint:'Pull an improvising worker back to the plan.'}
};
function canCall(M,id){
 if(M.done||M.stage!=='live'||M.decision||M.calls<=0)return false;
 if(id==='sheet')return !!M.offScript;
 if(id==='home')return M.len-M.t>45;
 return true;
}
function call(M,id){
 if(!canCall(M,id))return false;
 M.calls--;M.callsUsed.push(id);const w=M.w;
 say(M,`You shout from ringside: “${CALLS[id].name}.”`,'you');
 const listen=M.listen+(id==='home'?20:0)+(id==='sheet'&&M.leash==='script'?10:0);
 if(M.r()*100>listen){M.ignored++;say(M,rnd(M,[`${w.short} waves you away.`,`${w.short} doesn’t even look over.`,`${w.short} hears you. Does the opposite.`]),'bad');if(w.ego>=70)M.adj.morale-=1;return true}
 if(id==='slow'){M.mode={type:'slow',ticks:6};say(M,`${w.short} takes the call and slows it down with a rest hold.`)}
 if(id==='pickup'){M.mode={type:'pickup',ticks:6};say(M,`${w.short} hears you. The pace picks up.`)}
 if(id==='crowd'){M.mode={type:'crowd',ticks:5};say(M,`${w.short} turns to the crowd, arms out wide.`,'crowd')}
 if(id==='big'){spot(M,true,true)}
 if(id==='sheet'){M.offScript=null;M.comply=clamp(M.comply+15);say(M,`${w.short} nods. Back on the sheet.`)}
 if(id==='home'){const frac=M.t/M.len;if(frac<.6){M.shortened=true;M.len=M.t+70;}else M.len=Math.min(M.len,M.t+40);
  M.nearfallAt=M.nearfallAt.filter(x=>x*M.len>M.t).slice(0,1);if(!M.nearfallAt.length&&M.len-M.t>30)M.nearfallAt=[(M.t+20)/M.len];
  say(M,`${w.short} relays it to ${M.f.short}: take it home.`)}
 return true;
}

/* ---- decisions: the match pauses until the manager chooses ---- */
function decide(M,id){
 const w=M.w,f=M.f,p=M.p;
 const defs={
  injury:{title:`${w.short} is hurt`,body:`${w.name} landed badly. That’s a real ${M.injuryPart} injury, not a sell. The referee is looking over at you.`,options:[
   {id:'home',label:'Take it home now',hint:'Finish as booked within the minute. A short match, but the injury stays as it is.'},
   {id:'work',label:'Work through it',hint:'Keep the match going. The crowd may rally behind it. It may get worse.'},
   {id:'stop',label:'Stop the match',hint:'No contest. Half the purse, an unhappy booker, a protected wrestler.'}]},
  stiff:{title:`${f.short} is getting stiff`,body:`Those shots from ${f.name} are landing for real. ${w.short} glances at you between blows.`,options:[
   {id:'protect',label:'Cover up and ride it out',hint:'Keep the peace. The match loses a little.'},
   {id:'fire',label:'Give it back',hint:'The crowd will love it. The booker won’t. Someone may get hurt.'},
   {id:'ref',label:'Have the referee warn them',hint:'Calms it down, and takes the heat out of the match.'}]},
  time:{title:`${p.voice}: cut it short`,body:`From the production truck: “TV’s running long. Lose four minutes or we lose the finish on air.”`,options:[
   {id:'cut',label:'Cut four minutes',hint:'The booker is grateful. Less time to build to the finish.'},
   {id:'keep',label:'Let them work',hint:'Full match. The booker is furious unless it’s worth it (four stars or more).'}]},
  double:{title:`The crowd want ${w.short}`,body:`${p.venue.charAt(0).toUpperCase()+p.venue.slice(1)} is on its feet chanting for ${w.name}. The contract says ${w.short} loses tonight. ${f.short} is about to go for the cover.`,options:[
   {id:'job',label:'Do the job',hint:`Finish as booked. ${p.name} will remember you did business.`},
   {id:'kick',label:'Kick out. Win it.',hint:`Huge for ${w.short}. You will probably never work for ${p.name} again, and they won’t pay you.`}]}
 };
 M.decision={id,...defs[id]};
 say(M,defs[id].title+'.','alert',{big:true});
}
function resolve(M,choice){
 const d=M.decision;if(!d)return;M.decision=null;const w=M.w,f=M.f;
 const opt=d.options.find(o=>o.id===choice)||d.options[0];
 say(M,`Your call: “${opt.label}”`,'you');
 if(d.id==='injury'){
  if(choice==='home'){M.len=Math.min(M.len,M.t+50);if(M.t/M.len<.6)M.shortened=true;M.nearfallAt=[];say(M,`${w.short} nods through gritted teeth. Straight to the finish.`)}
  if(choice==='work'){M.workingHurt=true;M.crowd=clamp(M.crowd+5);M.adj.heat+=3;say(M,`${w.short} waves off the referee. The crowd start clapping. Brave, or daft.`,'crowd')}
  if(choice==='stop'){M.outcome='nc';M.adj.purseMul=.5;M.adj.trust-=6;M.adj.morale+=5;M.injury=Math.max(1,M.injury-1);M.stage='finish';}
 }
 if(d.id==='stiff'){
  if(choice==='protect'){M.stiff='protect';M.mode={type:'slow',ticks:3};M.wSt=clamp(M.wSt-8);say(M,`${w.short} covers up and rides out the storm.`)}
  if(choice==='fire'){M.stiff='fire';M.crowd=clamp(M.crowd+9);M.bonus+=10;M.adj.trust-=4;M.adj.morale+=4;say(M,`${w.short} fires back for real! This is a fight now!`,'crowd',{big:true});
   if(M.r()<.25){if(M.r()<.5&&!M.injury){M.injury=1;M.injuryPart='jaw';say(M,`${w.short} took one flush on the jaw. Wobbly.`,'bad')}else{M.foeHurt=true;say(M,`${f.short} is bleeding from the nose. That was not planned.`,'bad')}}}
  if(choice==='ref'){M.stiff='ref';M.crowd=clamp(M.crowd-4);say(M,`The referee has a word with ${f.short}. Things settle down.`)}
 }
 if(d.id==='time'){
  if(choice==='cut'){M.len=Math.max(M.t+90,M.len-240);M.adj.trust+=4;M.nearfallAt=M.nearfallAt.filter(x=>x*M.len>M.t+20).slice(0,2);if(!M.nearfallAt.length)M.nearfallAt=[(M.len-30)/M.len];say(M,'The referee gets the signal. Four minutes come out of the match.')}
  if(choice==='keep'){M.timeDefied=true;say(M,`${M.p.voice} is shouting in your headset. You take it off.`)}
 }
 if(d.id==='double'){
  if(choice==='job'){M.adj.trust+=5;M.adj.heat+=2;say(M,'You stand still. Business is business.')}
  if(choice==='kick'){
   if(w.pro>=85){M.refused=true;M.adj.morale-=2;say(M,`${w.short} hears you… and shakes the head. ${w.short} is doing the job.`,'agent',{big:true})}
   else{M.outcome='double';say(M,'You give the signal.','agent')}
  }
 }
}

function decisive(M,A,Df,step,end){
 if(A.sub){
  say(M,`${A.short} locks in ${the(A.finisher)}!`,'play',{...step(),big:true,pause:1});
  say(M,`${Df.short} reaches for the ropes…`,'play',{...step(),pause:2});
  say(M,`${Df.short} TAPS!`,'count',{...step(),big:true});
 }else{
  say(M,`${A.short} hits ${the(A.finisher)}!`,'play',{...step(),big:true,pause:1});
  say(M,'The cover.','count',{...step(),pause:1});
  say(M,'ONE!','count',{...step(),big:true,pause:1});say(M,'TWO!','count',{...step(),big:true,pause:2});say(M,'THREE!','count',{...step(),big:true});
 }
 say(M,end,'bell',{...step(),big:true});
}
/* ---- the finish ---- */
function finish(M){
 const w=M.w,f=M.f,o=M.o;let at=M.t;const step=(n=4)=>(at+=n,{at});
 if(M.outcome==='nc'){
  say(M,'The referee waves it off. The doctor is in the ring.','bad',{...step(),big:true});
  say(M,'No contest.','bell',{...step(),big:true});
 }else if(M.outcome==='double'){
  if(f.sub){say(M,`${f.short} locks in ${the(f.finisher)}!`,'play',{...step(),big:true,pause:1});say(M,`${w.short} should be tapping now…`,'play',{...step(),pause:2});
   say(M,`${w.short} BREAKS THE HOLD! That was not the plan!`,'crowd',{...step(),big:true,pause:1});}
  else{say(M,`${f.short} hits ${the(f.finisher)}! Cover!`,'play',{...step(),big:true,pause:1});
   say(M,'ONE!','count',{...step(),big:true,pause:1});say(M,'TWO!','count',{...step(),big:true,pause:2});
   say(M,`${w.short} KICKS OUT! That was not the plan!`,'crowd',{...step(),big:true,pause:1});}
  say(M,`${f.short} looks at the referee. The referee looks at the curtain.`,'agent',{...step(6),pause:1});
  decisive(M,w,f,step,`${w.name} has gone into business!`);
  say(M,`Chaos at ${M.p.venue}.`,'crowd',{...step(),big:true});
 }else{
  const k=o.finish;
  if(k==='win_clean'){
   say(M,`${w.short} sets up ${the(w.finisher)}…`,'play',{...step(),pause:1});
   decisive(M,w,f,step,`${w.name} wins it clean.`);
  }else if(k==='win_dirty'){
   say(M,`${f.short} has ${w.short} reeling… the referee is down after a collision!`,'play',{...step(),pause:1});
   say(M,`${w.short} grabs a fistful of tights. Roll-up!`,'play',{...step(),big:true,pause:1});
   say(M,'ONE!','count',{...step(),big:true,pause:1});say(M,'TWO!','count',{...step(),big:true,pause:2});say(M,'THREE!','count',{...step(),big:true});
   say(M,`${w.short} steals it! ${M.crowd>=60?'The crowd let them have it.':'Scattered boos.'}`,'bell',{...step(),big:true});
  }else if(k==='lose_protected'){
   say(M,`${w.short} hits ${the(w.finisher)}!`,'play',{...step(),big:true,pause:1});say(M,'Cover!','count',{...step(),pause:1});
   say(M,'ONE!','count',{...step(),big:true,pause:1});say(M,'TWO!','count',{...step(),big:true,pause:2});
   say(M,`${f.short}’s foot is on the rope!`,'crowd',{...step(),big:true,pause:1});
   say(M,`${w.short} argues with the referee, and ${f.short} rolls up from behind with a handful of tights!`,'play',{...step(),pause:1});
   say(M,'ONE! TWO! THREE!','count',{...step(),big:true});
   say(M,`${w.name} was robbed, and everyone saw it.`,'bell',{...step(),big:true});

}

 if(m.dtype==='poach'&&opt==='bonus'&&S.cash<400)return 'Not enough cash for the £400 bonus. Choose another response.';

 if(m.dtype==='favour'){const p=P(m.args[0]);text=d.resolve(m,p,opt)}
 else if(m.dtype==='clash'){const a=W(m.args[0]),b=W(m.args[1]);text=a&&b?d.resolve(m,a,opt,b):'They’ve both moved on.'}

/* Twelve-week regional circuit follows the initial four-week sponsor trial.
   Three checkpoints are evaluated against actual show results, not button presses. */
const CIRCUIT_TARGETS={

function circuitStatus(week=8){const t=CIRCUIT_TARGETS[week];if(!t)return null;
 const hist=S.history.filter(h=>h.season===1&&h.week>=5&&h.week<=week),quality=hist.some(h=>h.stars>=t.quality),feature=hist.some(h=>D.SLOTS[h.slot]?.rank>=D.SLOTS.feature.rank);

}

 const r=circuitStatus(S.week);S.circuitReviews.push({...r});if(r.met)S.cash+=r.reward;
 msg({from:'Your regional backer',subject:`${r.title} review — ${r.met?'bonus earned':'target missed'}`,kind:'info',body:[
  `Required: ${r.required} matches from week 5 onward, at least one ${r.quality}-star performance${r.feature?', plus a featured/main-event booking':''}.`,
  `Delivered: ${r.played} matches. Match quality: ${r.quality?'YES':'NO'}. Featured appearance: ${r.hasFeature?'YES':'NO'}.`,

 ]});
}

 for(const w of S.roster){
  const worked=S.history.some(h=>h.wid===w.id&&h.week===S.week&&h.season===S.season);
  const isInjured=!!w.injury,t=D.TRAINING[isInjured?'rest':w.training]||D.TRAINING.rest;
  const intensity=INTENSITY[w.intensity||'light']||INTENSITY.light;
  if(isInjured||w.training==='rest'){
   w.fatigue=clamp(w.fatigue-(worked?6:24));if(!worked)w.morale=clamp(w.morale+2);
  }else if(w.training==='promo'){
   S.cash-=40;S.business.training+=40;const g=Math.round(1+w.mic/35);w.heat=clamp(w.heat+g);w.fatigue=clamp(w.fatigue+2);
   const hot=Object.values(S.feuds).filter(f=>f.wid===w.id&&!f.closed).sort((a,b)=>b.heat-a.heat)[0];if(hot)hot.heat=clamp(hot.heat+6);
   lines.push(`${w.short} recorded a promo: −£40, heat +${g}${hot?', rivalry +6':''}.`);
  }else if(t.stat){

   w.progress[t.stat]=(w.progress[t.stat]||0)+growth;
   const levels=Math.floor(w.progress[t.stat]);w.progress[t.stat]-=levels;
   const gained=Math.min(99-cur,levels);w[t.stat]=clamp(cur+gained,0,99);
   w.fatigue=clamp(w.fatigue+(camp?13:intensity.fat)+(worked?5:0));
   w.prep??={};w.prep[t.stat]=Math.min(4,(w.prep[t.stat]||0)+1+(camp?1:0));
   const risk=(camp?.015:intensity.risk)*(w.fatigue>=65?2.5:1)*(worked?1.5:1);
   if(risk>0&&rand()<risk){w.injury=Math.max(w.injury||0,ri(1,3));w.injurySince=abs();lines.push(`${w.short} strained something in training. Out ${w.injury} week(s).`)}
   const spent=camp?185:intensity.cost;if(spent||gained)lines.push(`${w.short}: ${camp?'residential camp':intensity.name.toLowerCase()} in ${t.name.toLowerCase()}, ${money(spent)}; ${gained?`${t.stat} +${gained}`:'progress banked'}, fatigue ${w.fatigue}.`);if(w.program)w.program.gains+=gained;
  }
  if(w.program&&!isInjured){w.program.left--;if(w.program.left<=0){const old=w.program;w.prepHistory??=[];w.prepHistory.unshift({week:abs(),focus:old.focus,type:old.type,gains:old.gains});w.prepHistory=w.prepHistory.slice(0,8);w.program=null;w.intensity='light';w.training='rest';lines.push(`${w.short} completes ${old.total}-week development (${old.gains} skill points gained). Rest scheduled next week.`);}}
  if(isInjured&&w.injury && (w.injurySince??abs()-1)<abs()){w.injury--;if(!w.injury)lines.push(`${w.short} is fit again.`)}

 resolvePromises();
 for(const fd of Object.values(S.feuds)){if(!fd.closed&&fd.last!==abs())fd.heat=clamp(fd.heat-7)}
 for(const p of S.promoters){if(p.blacklist>0)p.blacklist--;p.trust=clamp(p.trust+(p.trust<45?1:p.trust>65?-1:0))}
 if(S.season===1&&S.week===4&&!S.monthReview){

  const grant=st.passed?450:0;S.cash+=grant;S.monthReview.best=Math.max(0,...S.history.filter(h=>h.season===1&&h.week<=4).map(h=>h.stars));S.monthReview.business={...S.business};
  msg({from:'Your backer',subject:st.passed?'The first month — investment approved':'The first month — no investment',kind:'info',body:[
   `Three-star match: ${st.okMatch?'YES':'NO'}. Cash of at least £750: ${st.cash?'YES':'NO'}. Reputation 30: ${st.rep?'YES':'NO'}. One wrestler develops by two skill points: ${st.developed?'YES':'NO'}.`,

   `Bank after review: ${money(S.cash)}.`]});
 }
 reviewCircuit();
 S.focus=2;
 S.week++;
 if(S.week>16){seasonEnd();}

function fitNote(o,w){
 const p=G.P(o.pid),notes=[];
 const best=D.STYLE_PLAN[w.style];
 if(best===p.likes)notes.push(`<span class="good">${esc(p.name)} crowds love a ${esc(w.style.toLowerCase())} worker</span>`);
 else notes.push(`<span class="dim">${esc(p.name)} wants a ${esc(planFor(p).name.toLowerCase())}; ${esc(w.short)} prefers ${esc(D.PLANS[best].name.toLowerCase())}</span>`);
 const f=G.F(o.rid);if(f.safe<55)notes.push(`<span class="bad">${esc(f.name)} is an unsafe worker</span>`);
 if(w.fatigue>=45)notes.push(`<span class="bad">${esc(w.short)} is tired (${w.fatigue})</span>`);
 if(D.FINISHES[o.finish].heat<-3&&w.heat>=60)notes.push(`<span class="bad">A clean loss will cost ${esc(w.short)} heat</span>`);
 const fd=G.feud(w.id,o.rid);if(fd&&!fd.closed&&fd.heat>0)notes.push(`<span class="good">Rivalry heat ${fd.heat}: a hotter crowd</span>`);
 return notes.join('<br>');
}

/* ======================= MATCH NIGHT ======================= */
const NIGHT_STORE='the-office-v23-match';
function persistNight(){
 if(!night?.queue)return;
 try{const m=night.M?{...night.M,rState:night.M.r?.getState?.()}:null;
 localStorage.setItem(NIGHT_STORE,JSON.stringify({queue:night.queue,i:night.i,speed:night.speed,results:night.results,plan:night.plan,stage:night.stage||'prep',M:m,past:night.past||[]}));
 }catch(e){console.warn('Match autosave failed',e)}
}
function clearNight(){try{localStorage.removeItem(NIGHT_STORE)}catch(e){}}
function resumeNight(){
 let saved=null;try{saved=JSON.parse(localStorage.getItem(NIGHT_STORE)||'null')}catch(e){}
 if(!saved||!Array.isArray(saved.queue)||!S()?.card?.length)return false;
 night={...saved,paused:true};
 if(night.i>=night.queue.length){endNight();return true}
 $('#tv').hidden=false;document.body.style.overflow='hidden';
 if(saved.stage==='live'&&saved.M){
  const restored=Mx.restore(saved.M);
  bell();clearTimeout(night.timer);night.M=restored;night.past=saved.past||[];night.paused=true;
  updateLive();const last=restored.log?.[restored.log.length-1];if(last)showLine(last,true);
  if(restored.decision&&!restored.queue.length)showDecision();
 }else if(saved.stage==='result'){
  if(night.i>=night.queue.length)endNight();else prep();
 }else prep();
 persistNight();return true;
}

const SPEED={slow:{line:2600,pause:1100},normal:{line:1500,pause:750},fast:{line:520,pause:260},skip:{line:0,pause:0}};
function startNight(){
 night={queue:S().card.slice().sort((a,b)=>D.SLOTS[a.slot].rank-D.SLOTS[b.slot].rank).map(c=>c.id),i:0,speed:night?.speed||'normal',results:[]};
 $('#toast').classList.remove('show');$('#tv').hidden=false;document.body.style.overflow='hidden';night.stage='prep';prep();persistNight();
}
function current(){return S().card.find(c=>c.id===night.queue[night.i])}
function strip(c){const p=G.P(c.pid);return `<div class="strip"><b>${esc(p.name.toUpperCase())} LIVE</b><span>${esc(p.venue)}</span><span>Match ${night.i+1} of ${night.queue.length}</span></div>`}
function prep(){
 const c=current();if(!c)return endNight();
 const w=G.W(c.wid),f=G.F(c.rid),p=G.P(c.pid),best=D.STYLE_PLAN[w.style],foeBest=D.STYLE_PLAN[f.style];
 night.plan=night.plan&&night.plan.cid===c.id?night.plan:{cid:c.id,game:best,leash:w.psych>=75&&w.ego<75?'free':'script',talk:'none'};
 const P=night.plan;
 const warn=[];if(w.intensity==='hard'&&w.training!=='rest'&&w.training!=='promo')warn.push('Intensive training this week will leave them tired before the bell.');if(w.fatigue>=45)warn.push(`${w.short} is tired (fatigue ${w.fatigue}). Stamina will run out sooner.`);if(w.morale<35)warn.push(`${w.short}’s morale is low (${w.morale}). Less likely to listen.`);if(w.flags.pushThrough)warn.push(`${w.short} is carrying a bad back.`);if(w.flags.dive)warn.push(`${w.short} plans to dive off the balcony.`);
 const fnotes=[];if(f.safe<55)fnotes.push('Unsafe. Spots against them go wrong more often.');if(f.ego>=68)fnotes.push('Ego. May start getting stiff.');if(f.psych>=85)fnotes.push('A brilliant storyteller.');if(f.ring>=80)fnotes.push('Excellent in the ring.');
 const fits=g=>[g===p.likes?`<i>${esc(p.name)} crowd</i>`:'',g===best?`<i>${esc(w.short)}’s style</i>`:'',g===foeBest?`<i>${esc(f.short)}’s style</i>`:''].join('');
 const opts=(name,obj,val)=>Object.entries(obj).map(([k,o])=>`<button class="opt" data-plan="${name}" data-val="${k}" aria-pressed="${val===k}"><b>${esc(o.name)}</b><span>${esc(o.blurb)}</span>${name==='game'?`<span class="fits">${fits(k)}</span>`:''}</button>`).join('');
 const finishLine={win_clean:`${w.short} wins clean`,win_dirty:`${w.short} wins dirty`,lose_protected:`${w.short} loses, protected`,lose_clean:`${w.short} loses clean`}[c.finish];
 $('#tv').innerHTML=`${strip(c)}<div class="wrap">
  <div class="vs"><div class="side you">${face('wrestler',w.id,w.name,'')}<div><h2>${esc(w.name)}</h2><small>${esc(w.style)}. Heat ${w.heat}</small></div></div><div class="v">v</div><div class="side them">${face('wrestler',f.id,f.name,'')}<div><h2>${esc(f.name)}</h2><small>${esc(f.style)}. Heat ${f.heat}</small></div></div></div>
  <div class="contract">The finish is in the contract: <em>${esc(finishLine)}</em>. ${esc(D.SLOTS[c.slot].name)}, ${c.minutes} minutes, ${money(c.purse)}.${c.tag?` ${esc(c.tag)}.`:''}</div>
  <div class="scout"><div><b>${esc(w.short)} tonight.</b> Stamina ${Math.round(100-w.fatigue*.7)}, morale ${w.morale}. ${warn.length?`<span class="warn">${esc(warn.join(' '))}</span>`:'Fit and ready.'}</div><div><b>${esc(f.short)}.</b> ${esc(fnotes.join(' ')||'A steady, professional opponent.')} Finisher: ${esc(f.finisher)}.</div></div>
  <fieldset class="decide"><legend>What is this match built on?</legend><div class="opts">${opts('game',D.PLANS,P.game)}</div></fieldset>
  <fieldset class="decide"><legend>Who calls it in the ring?</legend><div class="opts">${opts('leash',D.LEASH,P.leash)}</div></fieldset>
  <fieldset class="decide"><legend>Last word before the curtain</legend><div class="opts">${opts('talk',D.TALKS,P.talk)}</div></fieldset>
  <div class="prep-foot"><span class="dim">You get three calls from ringside once the bell goes.</span><button class="go" data-tv="bell">Send them out</button></div></div>`;
 $('#tv').scrollTop=0;night.stage='prep';persistNight();
}
function bell(){
 const c=current(),w=G.W(c.wid),f=G.F(c.rid),p=G.P(c.pid),P=night.plan;
 const trainingFatigue=w.training==='rest'?0:w.training==='promo'?0:w.program?.type==='camp'?8:w.intensity==='hard'?15:w.intensity==='standard'?5:0;
 const preparation={...w.prep};const focus=D.TRAINING[w.training]?.stat;
 if(focus&&!w.injury){preparation[focus]=(preparation[focus]||0)+(w.intensity==='hard'?2:w.intensity==='standard'?1.5:.6);}
 night.M=Mx.create({w:{...w,fatigue:G.clamp(w.fatigue+trainingFatigue)},f,p,slot:c.slot,minutes:c.minutes,finish:c.finish,feudHeat:c.feudHeat,blowoff:c.blowoff,plan:{game:P.game,leash:P.leash,talk:P.talk},preparation,flags:{...w.flags},seed:Math.floor(Math.random()*2**31)});
 night.past=[];night.paused=false;night.hint='';
 const callBtns=Object.entries(Mx.CALLS).map(([k,o],i)=>`<button class="call" data-call="${k}" data-hint="${esc(o.hint)}"><kbd>${i+1}</kbd>${esc(o.name)}</button>`).join('');
 $('#tv').innerHTML=`${strip(c)}<div class="wrap">
  <header class="score"><div class="side you">${face('wrestler',w.id,w.name,'')}<h2>${esc(w.short)}</h2><div class="stam" id="sY"><i></i></div></div>
   <div class="mid"><div class="live-stars" id="lStars" aria-label="Live rating">–</div><div class="clock" id="lClock">00:00</div><div class="phase" id="lPhase">Entrances</div></div>
   <div class="side them">${face('wrestler',f.id,f.name,'')}<h2>${esc(f.short)}</h2><div class="stam" id="sT"><i></i></div></div></header>
  <div class="mom" aria-hidden="true"><i id="lMom" style="width:50%"></i></div><div class="momlab"><span>${esc(w.short)} on top</span><span>${esc(f.short)} on top</span></div>
  <div class="feed"><div class="now" id="lNow" aria-live="polite"><span class="t"></span><span class="tx"></span></div><ol class="past" id="lPast"></ol></div>
  <div class="bench"><div><div class="gauge"><label>Atmosphere <b id="lCrowd">0</b></label><div class="gbar"><i id="lCrowdBar"></i></div></div>
   <div class="gauge"><label>Game plan <b id="lSheet">–</b></label></div>
   <div class="callsleft">Calls left <span id="lCalls">●●●</span></div></div>
   <div><div class="calls">${callBtns}</div><div class="callhint" id="lHint">Your calls go to the wrestler. They don’t always listen.</div>
   <div class="speed" role="group" aria-label="Commentary speed"><button data-pause>Pause</button><span class="gap"></span>${['slow','normal','fast','skip'].map(s=>`<button data-speed="${s}" aria-pressed="${night.speed===s}">${{slow:'Slow',normal:'Normal',fast:'Fast',skip:'To the end'}[s]}</button>`).join('')}</div></div></div></div>
  <div class="decision" id="decision" hidden></div>`;
 night.stage='live';updateLive();persistNight();schedule(300);
}
function schedule(ms){clearTimeout(night.timer);night.timer=setTimeout(pump,ms)}
function pump(){
 const M=night?.M;if(!M||night.paused)return;
 if(M.decision&&!M.queue.length)return showDecision();
 if(night.speed==='skip'){let line,n=0;while(n++<4000){if(M.decision&&!M.queue.length)break;line=Mx.next(M);if(!line)break;night.past.unshift(line);}
  if(night.past.length){showLine(night.past.shift(),true)}updateLive();if(M.decision)return showDecision();if(M.done)return schedule(500);return schedule(10)}
 const line=Mx.next(M);
 if(!line){if(M.done)return result();if(M.decision)return showDecision();return schedule(50)}
 showLine(line);updateLive();
 if(M.decision&&!M.queue.length){return schedule(SPEED[night.speed].line*.6+300)}
 const sp=SPEED[night.speed];schedule(sp.line+(line.pause||0)*sp.pause);
}
function showLine(line,quiet){
 const now=$('#lNow');if(!now)return;
 const prev=now.dataset.line?JSON.parse(now.dataset.line):null;
 if(prev&&!quiet)night.past.unshift(prev);
 now.className='now '+line.kind+(line.big?' big':'');now.dataset.line=JSON.stringify(line);
 now.innerHTML=`<span class="t">${esc(line.t)}</span><span class="tx">${esc(line.text)}</span>`;
 night.past=night.past.filter(x=>x.kind!=='count'||x.text.length>8).slice(0,10);
 $('#lPast').innerHTML=night.past.map(l=>`<li class="${l.kind} ${l.big?'big':''}"><span class="t">${esc(l.t)}</span><span>${esc(l.text)}</span></li>`).join('');persistNight();
}
function updateLive(){
 const M=night.M;if(!$('#lClock'))return;
 $('#lClock').textContent=Mx.fmt(M.t)+' / '+Mx.fmt(M.len);
 $('#lPhase').textContent=Mx.phaseName(M);
 $('#lStars').textContent=M.qN?starsText(Mx.liveStars(M))||'DUD':'–';
 $('#lCrowd').textContent=Math.round(M.crowd);$('#lCrowdBar').style.width=M.crowd+'%';
 $('#lMom').style.width=(50+M.mom/2)+'%';
 const y=$('#sY'),t=$('#sT');y.querySelector('i').style.width=M.wSt+'%';t.querySelector('i').style.width=M.fSt+'%';y.classList.toggle('low',M.wSt<30);t.classList.toggle('low',M.fSt<30);
 $('#lSheet').textContent=M.leash==='free'?'Called live':M.offScript?(M.offScript==='showboat'?'Showboating':'Audibles'):'On the sheet';$('#lSheet').className=M.offScript?'warnv':'';
 $('#lCalls').textContent='●'.repeat(M.calls)+'○'.repeat(3-M.calls);
 document.querySelectorAll('[data-call]').forEach(b=>b.disabled=!Mx.canCall(M,b.dataset.call));
 const pb=document.querySelector('[data-pause]');if(pb)pb.textContent=night.paused?'Resume':'Pause';
}
function showDecision(){
 const d=night.M.decision,box=$('#decision');if(!d||!box)return;
 box.innerHTML=`<div class="box" role="alertdialog" aria-labelledby="dTitle"><span class="flash">${esc(Mx.fmt(night.M.t))}  DECISION</span><h2 id="dTitle">${esc(d.title)}</h2><p>${esc(d.body)}</p><div class="opts">${d.options.map(o=>`<button class="opt" data-decide="${o.id}"><b>${esc(o.label)}</b><span>${esc(o.hint)}</span></button>`).join('')}</div></div>`;
 box.hidden=false;box.querySelector('button')?.focus();
}
function decideNow(id){const M=night.M;Mx.resolve(M,id);persistNight();$('#decision').hidden=true;if(night.speed==='skip')night.speed='normal',document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.speed===night.speed));updateLive();schedule(400)}
function doCall(id){const M=night.M;if(!Mx.canCall(M,id))return;Mx.call(M,id);persistNight();updateLive();if(!night.paused)schedule(250);else{const l=Mx.next(M);if(l)showLine(l)}}
function result(){
 clearTimeout(night.timer);const M=night.M,c=current(),w=G.W(c.wid),f=G.F(c.rid),p=G.P(c.pid);
 const fin={...M.final,log:M.log.map(({t,text,kind,big})=>({t,text,kind,big}))};
 const cons=G.applyResult(c,fin);night.results.push({name:w.name,foe:f.name,stars:fin.stars});
 const verdict=fin.stars>=4.5?'An all-timer.':fin.stars>=4?'People will talk about that one.':fin.stars>=3?'A good night’s work.':fin.stars>=2?'Solid enough.':fin.stars>=1?'Forgettable.':'A disaster.';
 const pct=fin.script===null?'Called live':Math.round(fin.script*100)+'%';
 night.i++;const more=night.i<night.queue.length;
 $('#tv').innerHTML=`<div class="strip"><b>${esc(p.name.toUpperCase())}: FULL TIME</b><span>${esc(w.name)} v ${esc(f.name)}</span></div><div class="wrap">
  <div class="final"><div class="bigstars">${starsText(fin.stars)||'DUD'}</div><div class="verdict">${esc(verdict)}</div></div>
  <div class="facts"><div><small>Crowd at the bell</small><b>${fin.crowd}</b></div><div><small>Loudest</small><b>${fin.crowdPeak}</b></div><div><small>Big spots</small><b>${fin.spotHits}/${fin.spots}</b></div><div><small>Near falls</small><b>${fin.nearfalls}</b></div><div><small>Followed the sheet</small><b>${pct}</b></div><div><small>Calls heard</small><b>${fin.callsUsed.length-fin.ignored}/${fin.callsUsed.length}</b></div></div>
  <ul class="cons">${cons.map(x=>`<li class="${x.tone>0?'up':x.tone<0?'down':''}">${esc(x.text)}</li>`).join('')}</ul>
  <details><summary class="dim" style="cursor:pointer;margin-bottom:10px">Full commentary</summary>${logList(fin.log)}</details>
  <div class="prep-foot"><span class="dim">${more?`Next: ${esc(G.W(S().card.find(x=>x.id===night.queue[night.i])?.wid)?.name||'')}`:'That’s the night.'}</span><button class="go" data-tv="${more?'next':'done'}">${more?'Next match':'Back to the office'}</button></div></div>`;
 $('#tv').scrollTop=0;night.M=null;night.plan=null;night.stage='result';persistNight();
}
function endNight(){
 clearTimeout(night?.timer);$('#tv').hidden=true;$('#tv').innerHTML='';document.body.style.overflow='';
 const res=night?.results||[];clearNight();night={speed:night?.speed||'normal'};
 if(res.length)G.S.inbox.unshift({id:'mn'+Date.now(),week:S().week,season:S().season,read:true,kind:'info',from:'Your road agent',subject:'Match night report',body:res.map(r=>`${r.name} v ${r.foe}: ${starsText(r.stars)||'DUD'}`)});
 G.endWeek();
 if(S().over){render();return gameOver()}
 tab='inbox';openMsg=null;render();window.scrollTo(0,0);toast(`Week ${S().week}. ${S().offers.length} offers on the table.`);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-tab]');if(!t)return;const d=t.dataset;
 if(t.id==='continue')return proceed();
 if(d.page){screenPage+=d.page==='next'?1:-1;updateScreen();return}
 if(d.tab||d.jump){tab=d.tab||d.jump;openW=null;render();window.scrollTo(0,0);return}
 if(d.msg){openMsg=d.msg;renderInbox();return}
 if(d.answer){const out=G.answer(d.mid,d.answer);render();if(out)toast(out);return}
 if(d.openw){openW=openW===d.openw?null:d.openw;renderRoster();return}
 if(d.checkin){renderPrivateMeeting(d.checkin);return}
 if(d.private){const r=G.checkIn(d.wid,d.private);if(r.error)return toast(r.error);$('#modal').close();render();toast(r.text);return}
 if(d.program){const err=G.startProgram(d.wid,d.program);if(err)toast(err);else toast(d.program==='camp'?'Three-week camp booked; wrestler unavailable.':'Development block committed.');renderRoster();return}
 if(d.cancelprogram){const err=G.cancelProgram(d.cancelprogram);if(err)toast(err);else toast('Programme ended. Future weeks freed, but training already paid for.');renderRoster();return}
 if(d.hirecoach){const err=G.hireCoach(d.hirecoach);if(err)toast(err);else toast('Coach hired. Weekly salary starts immediately.');renderRoster();return}
 if(d.firecoach){const err=G.fireCoach();if(err)toast(err);else toast('Coach released. Future salaries stop.');renderRoster();return}
 if(d.sign){const err=G.sign(d.sign);if(err)toast(err);else{const w=G.W(d.sign);toast(`${w.name} signed. Wages: ${money(w.wage)} a week.`)}render();return}
 if(d.release){const w=G.W(d.release);dialog(`Release ${w.name}?`,`<p>${esc(w.short)} leaves today and you get nothing back. Any booking for them is cancelled.</p>`,[['Keep them','close'],['Release','release:'+w.id,'danger']]);return}
 if(d.book){const o=S().offers.find(o=>o.id===d.book);const when=o?.eventAbs;const err=G.book(d.book,pick[d.book]);if(err)toast(err);else toast(when>G.abs()?`Signed for ${weekLabel(when)}. Purse paid after the match.`:'Booked on this week’s card.');render();return}
 if(d.unbook){G.unbook(d.unbook);render();toast('Booking cancelled; promoter trust −6.');return}
 if(d.talkopen){const o=S().offers.find(x=>x.id===d.talkopen);renderMeeting(d.talkopen,o?.talk?.wid||pick[d.talkopen]);return}
 if(d.talkaction){const res=G.talkMove(d.oid,d.wid,d.talkaction);if(res.error)return toast(res.error);renderMeeting(d.oid,d.wid);return}
 if(d.talkbook){const o=S().offers.find(o=>o.id===d.talkbook);const when=o?.eventAbs;const err=G.book(d.talkbook,d.wid);if(err)return toast(err);$('#modal').close();render();toast(when>G.abs()?`Future booking confirmed for ${weekLabel(when)}.`:'Contract signed with the exact agreed terms.');return} 
 if(d.replay){const x=S().history[+d.replay];dialog(`${x.name} vs ${x.foe}`,`<p class="dim">${esc(x.promoter)}, season ${x.season} week ${x.week}. ${starsText(x.stars)}</p>${x.notes.map(n=>`<p>${esc(n)}</p>`).join('')}${logList(x.log)}`);return}
 if(d.act==='export'){const blob=new Blob([JSON.stringify(S())],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`the-office-s${S().season}w${S().week}.json`;a.click();return}
 if(d.act==='import'){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{try{const x=JSON.parse(t);if(![20,21,22].includes(x.v))throw 0;G.S=x;if(!G.S)throw 0;G.save();tab='inbox';render();toast('Save loaded.')}catch(err){toast('That file isn’t a valid v2–v2.2 save.')}})};i.click();return}
 if(d.act==='newgame'){dialog('Start a new career?','<p>Your current career will be overwritten.</p>',[['Cancel','close'],['Start again','newgame','danger']]);return}
 if(d.dlg){const m=$('#modal');m.close();if(d.dlg.startsWith('release:')){const w=G.W(d.dlg.slice(8));G.release(w.id);openW=null;render();toast(`${w.name} released.`)}if(d.dlg==='newgame'){clearNight();G.wipe();G.fresh();tab='roster';openMsg=null;night=null;$('#tv').hidden=true;document.body.style.overflow='';render()}return}
 // title
 if(d.title==='new'){if(G.hasSave()&&!confirm('Overwrite your saved career?'))return;clearNight();G.fresh();$('#title').hidden=true;tab='roster';render();toast('Sign your first wrestler.');return}
 if(d.title==='load'){if(!G.load())return toast('No saved career found.');$('#title').hidden=true;tab='inbox';render();if(resumeNight())toast('Match restored. Paused at your last saved decision.');return}
 // tv
 if(d.plan){night.plan[d.plan]=d.val;t.parentElement.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
 if(d.tv==='bell')return bell();
 if(d.tv==='next'){prep();return}
 if(d.tv==='done')return endNight();
 if(d.call)return doCall(d.call);
 if(d.decide)return decideNow(d.decide);
 if(d.speed!==undefined){night.speed=d.speed;document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.speed===night.speed));if(!night.paused)schedule(50);return}
 if(t.hasAttribute('data-pause')){night.paused=!night.paused;updateLive();if(!night.paused)schedule(100);return}
});
document.addEventListener('change',e=>{
 const t=e.target,d=t.dataset;
 if(d.train){G.setTraining(d.train,t.value);renderRoster();toast(`${G.W(d.train).short}: ${D.TRAINING[t.value].name.toLowerCase()} this week.`);return}
 if(d.intensity){G.setIntensity(d.intensity,t.value);renderRoster();toast(`${G.W(d.intensity).short}: ${G.INTENSITY[t.value].name}, ${money(G.trainingCost(G.W(d.intensity)))}/week.`);return}
 if(d.pick){pick[d.pick]=t.value;renderBookings();return}
});
document.addEventListener('mouseover',e=>{const b=e.target.closest('[data-hint]');if(b&&$('#lHint'))$('#lHint').textContent=b.dataset.hint});
document.addEventListener('focusin',e=>{const b=e.target.closest('[data-hint]');if(b&&$('#lHint'))$('#lHint').textContent=b.dataset.hint});
document.addEventListener('keydown',e=>{
 if(night?.M&&!$('#tv').hidden){
  const box=$('#decision');if(box&&!box.hidden)return;
  if(e.key===' '){e.preventDefault();night.paused=!night.paused;updateLive();if(!night.paused)schedule(100);return}
  const n=+e.key;if(n>=1&&n<=6){doCall(Object.keys(Mx.CALLS)[n-1]);return}
 }
});

/* ---------- boot ---------- */
function boot(){
 if(G.hasSave())$('#loadBtn').hidden=false;
 $('#title').hidden=false;
}
window.OfficeUI={get night(){return night}};
window.addEventListener('DOMContentLoaded',()=>{
 const d=$('#modal');d.addEventListener('close',()=>{
  const oid=d.dataset.talkoid;if(oid&&S()){
   const o=S().offers.find(x=>x.id===oid);
   if(o?.talk?.step==='start'){o.talk=null;G.save();}
  }
  delete d.dataset.talkoid;
  if(S())render();
 });
 boot();
});
})();
</script>
</body>
</html>
