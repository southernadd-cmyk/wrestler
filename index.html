<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#161321">
    <meta name="description" content="Build a deck, read your rival and fight through the Spirit Cup in a sumo roguelite.">
    <title>Dohyō — Spirit Cup</title>
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="wordmark" href="./" aria-label="Dohyō Spirit Cup">
          <span class="ring-mark" aria-hidden="true"></span>
          <span><strong>DOHYŌ</strong><small>SPIRIT CUP</small></span>
        </a>
        <nav class="site-nav" aria-label="Game options">
          <a class="quiet" href="./career.html">Classic career</a>
          <button class="quiet" id="sound-toggle" type="button" aria-pressed="true">Sound on</button>
        </nav>
      </div>
    </header>

    <main class="shell">
      <div class="masthead">
        <div>
          <p class="eyebrow" id="page-kicker">THE STABLE</p>
          <h1 id="page-title" tabindex="-1">Enter the Spirit Cup</h1>
          <p class="subtitle" id="page-subtitle">Read the rival and build a sequence from the cards in your hand.</p>
        </div>
        <ol class="bracket" id="bracket" aria-label="Tournament rounds"></ol>
      </div>

      <div class="layout">
        <section class="arena-panel" aria-label="Sumo arena">
          <div class="arena-screen" id="arena-screen">
            <canvas id="arena-3d" aria-hidden="true"></canvas>
            <canvas id="arena-overhead" aria-hidden="true" hidden></canvas>
            <div class="camera-tag"><span></span><b id="camera-name">RINGSIDE</b></div>
            <div class="names" aria-label="Rikishi in the ring">
              <div class="name east"><small>EAST</small><strong id="east-name">Hoshimori</strong></div>
              <span class="versus">VS</span>
              <div class="name west"><small>WEST</small><strong id="west-name">Aonami</strong></div>
            </div>
          </div>
          <div class="arena-report">
            <p id="arena-call" aria-live="polite">Both rikishi take their marks.</p>
            <div id="position-track"></div>
          </div>
        </section>

        <section class="play-panel" id="play-panel" aria-label="Player controls"></section>
        <aside class="side-panel" id="side-panel" aria-label="Rival and run information"></aside>
      </div>
      <footer class="site-footer">
        <span>DOHYŌ <b>•</b> SPIRIT CUP</span>
        <span id="save-status">Progress saves in this browser.</span>
      </footer>
    </main>
    <script type="module" src="/src/cup.js"></script>
  </body>
</html>
