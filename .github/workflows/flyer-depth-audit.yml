name: Flyer depth and stamina audit
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flyer-depth:
    name: All five plans / three skill tiers / all opponents and durations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test narrated skill-aware recovery and real aerial commitment
        run: node tests/flyer-recovery-finish.test.cjs
      - name: Assert diagnostic repeatability and matched inputs
        run: node tests/flyer-depth-audit.test.cjs
      - name: Diagnose final-three-minute aerial execution (96 matches)
        shell: bash
        run: |
          set -euo pipefail
          node tools/graph-lab/flyer-finish-trace.cjs 24 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run full flyer quality and endurance matrix
        shell: bash
        run: |
          set -euo pipefail
          node tools/graph-lab/flyer-depth-audit.cjs 6 --json-file | tee "$GITHUB_STEP_SUMMARY"
      - name: Retain complete structured results
        uses: actions/upload-artifact@v4
        with:
          name: flyer-depth-audit-json
          path: flyer-depth-audit.json
          if-no-files-found: error
