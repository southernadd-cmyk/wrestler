name: Flyer depth and stamina audit
on:
  pull_request:
    paths:
      - 'tools/graph-lab/flyer-depth-audit.cjs'
      - 'tests/flyer-depth-audit.test.cjs'
      - '.github/workflows/flyer-depth-audit.yml'
      - 'assets/js/match-engine.js'
      - 'assets/js/data.js'
      - 'assets/js/roster-registry.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flyer-depth:
    name: All five plans / three skill tiers / all opponents and durations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert diagnostic repeatability and matched inputs
        run: node tests/flyer-depth-audit.test.cjs
      - name: Run full flyer quality and endurance matrix
        shell: bash
        run: |
          set -euo pipefail
          node tools/graph-lab/flyer-depth-audit.cjs 6 --json-file | tee "$GITHUB_STEP_SUMMARY"
      - name: Retain complete structured results
        uses: actions/upload-artifact@v4
        with:
          name: flyer-depth-audit-json
          path: flyer-depth-audit.json
          if-no-files-found: error
