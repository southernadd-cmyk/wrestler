name: Career rivalry continuity

on:
  schedule:
    - cron: '43 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  five-week-career:
    name: Five-week persisted rivalry
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out real career and match engine
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay and verify saved five-week rivalry
        shell: bash
        run: |
          set -euo pipefail
          node tests/career-continuity-audit.test.cjs
          node tools/career-continuity-audit.cjs | tee "$GITHUB_STEP_SUMMARY"
