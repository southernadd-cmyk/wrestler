name: Simulation tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify changed files
    runs-on: ubuntu-24.04
    outputs:
      run_full: ${{ steps.paths.outputs.run_full }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether gameplay tests are required
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Fail safely: unknown refs, manual runs and non-documentation changes get full tests.
          run_full=true
          if [[ "$EVENT_NAME" != workflow_dispatch && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            mapfile -d '' changed < <(git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA")
            if (( ${#changed[@]} > 0 )); then
              run_full=false
              for path in "${changed[@]}"; do
                case "$path" in
                  *.md|*.mdx|docs/readme/*.svg|docs/readme/*.png)
                    ;;
                  *)
                    run_full=true
                    break
                    ;;
                esac
              done
            fi
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "Full gameplay and browser test suite: $run_full"

  tests:
    name: Regression suite (Node 22)
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        if: needs.classify.outputs.run_full == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check portrait atlas, portraits and README gallery are up to date
        run: |
          python -m pip install --quiet pillow
          python tools/build_portraits.py --check
      - name: Documentation-only check complete
        if: needs.classify.outputs.run_full == 'false'
        run: echo 'Portrait and README generation verified; gameplay suite not needed.'
      - name: Focused pull request safety checks (no full simulation matrix)
        if: needs.classify.outputs.run_full == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node tests/aerial-attempts.test.cjs
          node tests/phase6b-pacing.test.cjs
          node tests/phase6b-all-plan-quality.test.cjs
          node tests/phase9-graph-validation.test.cjs
          node tests/phase9-authored-chains.test.cjs
          node tests/pre-match-integration.test.cjs
          # Run the compact booth fixture in the existing PR smoke gate.
          node tests/commentary-memory.test.cjs
          # Branch-scoped paired witness for v0.6.2 texture-only narration.
          # Use the merged v0.6.1 commit as the control; no extra workflow.
          if [[ "${{ github.head_ref }}" == "fix/commentary-texture-variety-20261121" ]]; then
            git fetch --no-tags --depth=1 origin 90e5ba0509231442c15da0738d7e2adc55606de1
            COMMENTARY_BASE_SHA=90e5ba0509231442c15da0738d7e2adc55606de1 node tests/commentary-memory.test.cjs
          fi
          if test -f tests/flyer-recovery-finish.test.cjs; then
            node tests/flyer-recovery-finish.test.cjs
          fi
          echo 'PR smoke tests passed. Full simulation and browser suites run on main or via manual dispatch.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run all simulation tests
        if: needs.classify.outputs.run_full == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          for suite in tests/*.test.cjs; do
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done

  browser:
    name: Browser journeys (Chromium)
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Pull request — browser suite deferred to integration
        if: github.event_name == 'pull_request' && needs.classify.outputs.run_full == 'true'
        run: echo 'Full Chromium browser journeys run on main or via workflow_dispatch.'
      - name: Documentation-only change — browser tests not needed
        if: needs.classify.outputs.run_full == 'false'
        run: echo 'No game or browser code changed.'
      - name: Check out source
        if: needs.classify.outputs.run_full == 'true' && github.event_name != 'pull_request'
        uses: actions/checkout@v4
      - name: Use Node.js 22
        if: needs.classify.outputs.run_full == 'true' && github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools (CI only)
        if: needs.classify.outputs.run_full == 'true' && github.event_name != 'pull_request'
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Exercise desktop, mobile and saved result-night journeys
        if: needs.classify.outputs.run_full == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/office-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          node tests/browser-smoke.cjs
          node tests/graph-lab-browser.cjs
