name: Simulation tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify changed files
    runs-on: ubuntu-24.04
    outputs:
      run_full: ${{ steps.paths.outputs.run_full }}
      negotiation_browser: ${{ steps.paths.outputs.negotiation_browser }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether gameplay tests are required
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Fail safely: unknown refs, manual runs and non-documentation changes get full tests.
          run_full=true
          negotiation_browser=false
          if [[ "$EVENT_NAME" != workflow_dispatch && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            mapfile -d '' changed < <(git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA")
            if (( ${#changed[@]} > 0 )); then
              run_full=false
              for path in "${changed[@]}"; do
                case "$path" in
                  assets/js/negotiation-v2.js|assets/js/negotiation-career.js|tests/negotiation-trade-browser.cjs|tests/negotiation-career-browser.cjs|tests/negotiations-tradeoffs.test.cjs|tests/negotiations-career.test.cjs)
                    negotiation_browser=true
                    ;;
                esac
                case "$path" in
                  *.md|*.mdx|docs/readme/*.svg|docs/readme/*.png)
                    ;;
                  *)
                    run_full=true
                    ;;
                esac
              done
            fi
          fi
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "negotiation_browser=$negotiation_browser" >> "$GITHUB_OUTPUT"
          echo "Gameplay checks: $run_full; targeted negotiation browser: $negotiation_browser"

  tests:
    name: Regression suite (Node 22)
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        if: needs.classify.outputs.run_full == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check portrait atlas, portraits and README gallery are up to date
        run: |
          python -m pip install --quiet pillow
          python tools/build_portraits.py --check
      - name: Documentation-only check complete
        if: needs.classify.outputs.run_full == 'false'
        run: echo 'Portrait and README generation verified; gameplay suite not needed.'
      - name: Focused pull request safety checks (no full simulation matrix)
        if: needs.classify.outputs.run_full == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node tests/aerial-attempts.test.cjs
          node tests/phase6b-pacing.test.cjs
          node tests/phase6b-all-plan-quality.test.cjs
          node tests/phase9-graph-validation.test.cjs
          node tests/phase9-authored-chains.test.cjs
          node tests/pre-match-integration.test.cjs
          node tests/structure-planning-baseline.test.cjs
          node tests/structure-contracts.test.cjs
          node tests/structure-dynamic-planner.test.cjs
          # Short booking-negotiation tests cover real bargaining costs, proposal
          # acceptance, distinct promoter priorities and safe contract signing.
          # Keep these in this existing PR gate, not a separate workflow.
          node tests/negotiations-v2.test.cjs
          node tests/negotiations-personalities.test.cjs
          node tests/negotiations-tradeoffs.test.cjs
          node tests/negotiations-career.test.cjs
          node tests/negotiation-balance-audit.cjs
          # Signed finish choices and legal audibles use the same match-engine boundary.
          node tests/agents-room.test.cjs
          node tests/brawl-endurance.test.cjs
          # Run the compact booth fixture in the existing PR smoke gate.
          node tests/commentary-memory.test.cjs
          # v0.6.3 residual-texture audit against the merged v0.6.2 control.
          # Reuse the existing focused PR job, not new workflows.
          if [[ "${{ github.head_ref }}" == "fix/commentary-residual-texture-v063-20261121" ]]; then
            git fetch --no-tags --depth=1 origin 93342b09508d014ce002b1a5f7098ab5a1fa6321
            COMMENTARY_BASE_SHA=93342b09508d014ce002b1a5f7098ab5a1fa6321 node tests/commentary-memory.test.cjs
          elif [[ "${{ github.head_ref }}" == "fix/commentary-action-variety-v064-20261121" ]]; then
            git fetch --no-tags --depth=1 origin 4e99f28af5053f4efd74a91409a72891902a7f79
            COMMENTARY_BASE_SHA=4e99f28af5053f4efd74a91409a72891902a7f79 node tests/commentary-memory.test.cjs
          fi
          if test -f tests/flyer-recovery-finish.test.cjs; then
            node tests/flyer-recovery-finish.test.cjs
          fi
          echo 'PR smoke tests passed. Full simulation and browser suites run on main or via manual dispatch.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run all simulation tests
        if: needs.classify.outputs.run_full == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          for suite in tests/*.test.cjs; do
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done

  browser:
    name: Browser journeys (Chromium)
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Pull request — browser suite deferred to integration
        if: github.event_name == 'pull_request' && needs.classify.outputs.run_full == 'true' && needs.classify.outputs.negotiation_browser != 'true'
        run: echo 'Full Chromium browser journeys run on main or via workflow_dispatch.'
      - name: Documentation-only change — browser tests not needed
        if: needs.classify.outputs.run_full == 'false'
        run: echo 'No game or browser code changed.'
      - name: Check out source
        if: needs.classify.outputs.run_full == 'true' && (github.event_name != 'pull_request' || needs.classify.outputs.negotiation_browser == 'true')
        uses: actions/checkout@v4
      - name: Use Node.js 22
        if: needs.classify.outputs.run_full == 'true' && (github.event_name != 'pull_request' || needs.classify.outputs.negotiation_browser == 'true')
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools (CI only)
        if: needs.classify.outputs.run_full == 'true' && (github.event_name != 'pull_request' || needs.classify.outputs.negotiation_browser == 'true')
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Exercise desktop, mobile and saved result-night journeys
        if: needs.classify.outputs.run_full == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/office-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          node tests/browser-smoke.cjs
          node tests/graph-lab-browser.cjs
      - name: Check targeted booking negotiations on desktop and phone (PR only)
        if: needs.classify.outputs.run_full == 'true' && github.event_name == 'pull_request' && needs.classify.outputs.negotiation_browser == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/office-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          node tests/negotiation-trade-browser.cjs
          node tests/negotiation-career-browser.cjs
