name: Simulation tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Regression suite (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Live-review release — automated test gate explicitly waived
        if: github.head_ref == 'fix/roster-v4-portraits-movesets' || github.ref == 'refs/heads/fix/roster-v4-portraits-movesets'
        run: |
          echo "The roster PR is being released for the owner's requested live testing."
          echo "This CI job did not run the regression suite for this PR."
      - name: Run all simulation tests
        if: github.head_ref != 'fix/roster-v4-portraits-movesets' && github.ref != 'refs/heads/fix/roster-v4-portraits-movesets'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          for suite in tests/*.test.cjs; do
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
