name: Simulation tests

# The only automatic release gate: select fast checks from changed files.
# Full simulation and Chromium audits are available by manual dispatch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Regression suite (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select only relevant checks
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          suites="$RUNNER_TEMP/fast-suites.txt"
          syntax="$RUNNER_TEMP/changed-js.txt"
          : > "$suites"; : > "$syntax"
          add() { [[ -f "$1" ]] && ! grep -Fxq "$1" "$suites" && echo "$1" >> "$suites" || :; }
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "run_portrait=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=targeted" >> "$GITHUB_OUTPUT"
          portrait=false
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            mapfile -d '' files < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
            for file in "${files[@]}"; do
              echo "Changed: $file"
              case "$file" in
                tools/portrait-audit/*|assets/academy/*|assets/portraits/*)
                  portrait=true; continue ;;
                *.md|*.mdx|docs/readme/*.svg|docs/readme/*.png|.github/workflows/*)
                  continue ;;
                assets/js/ringfax.js|assets/css/ringfax.css|tests/ringfax-*.cjs)
                  add tests/ringfax-phase0-baseline.test.cjs
                  add tests/ringfax-phase1.test.cjs ;;
                assets/js/*match*.js|assets/js/*structure*.js|assets/js/*commentary*.js|assets/js/technique-*.js|assets/js/data.js|assets/js/roster-registry.js)
                  add tests/match-flow.test.cjs
                  add tests/earned-nearfall.test.cjs
                  add tests/structure-contracts.test.cjs ;;
                assets/js/*negotiat*.js|assets/js/*book*.js|assets/js/*territory*.js)
                  add tests/booking-office.test.cjs
                  add tests/negotiations-v2.test.cjs ;;
                assets/js/*train*.js|assets/js/*roster*.js)
                  add tests/training-intelligence.test.cjs ;;
                assets/js/*career*.js|assets/js/*save*.js|assets/js/*injur*.js)
                  add tests/save-integrity.test.cjs ;;
                assets/js/*.js|assets/*.js|assets/css/*.css|index.html)
                  add tests/ui-accessibility.test.cjs ;;
                tests/*.test.cjs)
                  add "$file" ;;
                *)
                  # Source changes outside known areas get one cheap smoke check.
                  add tests/match-flow.test.cjs ;;
              esac
              if [[ "$file" == *.js || "$file" == *.cjs ]]; then
                [[ -f "$file" ]] && echo "$file" >> "$syntax"
              fi
            done
          else
            echo "Unclassifiable diff: conservative fast smoke"
            add tests/match-flow.test.cjs
            add tests/ui-accessibility.test.cjs
            portrait=true
          fi
          echo "run_portrait=$portrait" >> "$GITHUB_OUTPUT"
          if [[ -s "$suites" || -s "$syntax" ]]; then
            echo "run_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_node=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change: no installs or regression tests."
          fi
          echo "Selected test files:"
          cat "$suites"
      - uses: actions/setup-node@v4
        if: steps.select.outputs.mode == 'full' || steps.select.outputs.run_node == 'true'
        with:
          node-version: '22'
      - name: Targeted syntax and regression checks
        if: steps.select.outputs.mode == 'targeted' && steps.select.outputs.run_node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [[ -z "$path" ]] || node --check "$path"
          done < "$RUNNER_TEMP/changed-js.txt"
          while IFS= read -r suite; do
            if [[ -n "$suite" ]]; then
              echo "::group::$suite"
              node "$suite"
              echo "::endgroup::"
            fi
          done < "$RUNNER_TEMP/fast-suites.txt"
      - name: Full simulation suite (manual only)
        if: steps.select.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          for suite in tests/*.test.cjs; do
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done

      - uses: actions/setup-python@v5
        if: steps.select.outputs.run_portrait == 'true'
        with:
          python-version: '3.12'
      - name: Install artwork screening dependencies
        if: steps.select.outputs.run_portrait == 'true'
        run: python -m pip install -r tools/portrait-audit/requirements.txt
      - name: Academy portrait screening
        id: portrait
        if: steps.select.outputs.run_portrait == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python tools/portrait-audit/audit.py self-test
          python tools/portrait-audit/audit.py gate --base "$BASE_SHA" --out "$RUNNER_TEMP/portrait-audit"
      - uses: actions/upload-artifact@v4
        if: always() && steps.portrait.outcome != 'skipped' && steps.select.outputs.run_portrait == 'true'
        with:
          name: portrait-screening
          path: ${{ runner.temp }}/portrait-audit
          if-no-files-found: ignore

  browser:
    name: Browser journeys (Chromium)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium only for requested full audit
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run full browser journeys
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/office-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && break
            sleep 1
          done
          node tests/browser-smoke.cjs
          node tests/graph-lab-browser.cjs
          node tests/ringfax-browser.cjs
