name: Assemble living-roster artwork

on:
  push:
    branches:
      - fix/roster-v4-portraits-movesets

permissions:
  contents: write

jobs:
  pack:
    # One-time branch-only asset materialisation. Bot's resulting commit is not
    # fed into another asset commit loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline asset packer dependency
        run: python -m pip install pillow
      - name: Export exactly named game-rendered portraits
        run: node tools/export-roster-portraits.cjs assets/portraits
      - name: Pack and validate 192x1260 atlas and unified README grid
        run: python pack_portraits.py assets/portraits --repo . --strict
      - name: Run full regression suite before changing the branch
        run: node tests/run-tests.cjs
      - name: Commit verified binary assets and source updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portrait-atlas.png assets/portraits/ assets/js/portraits.js assets/css/core.css readme.md tests/roster.test.cjs tests/structure.test.cjs tests/portrait-art.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Pack 52 named portraits and publish unified 80-person README roster"
            git push origin HEAD:fix/roster-v4-portraits-movesets
          fi
