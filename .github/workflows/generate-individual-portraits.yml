name: One-off individual portrait generation
on:
  push:
    branches: [perf/individual-age-portraits]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python tools/split_age_portraits.py
      - run: |
          node --check assets/js/portraits.js
          node --check assets/js/ui.js
          node tests/portrait-v4.test.cjs
          node tests/portrait-ageing.test.cjs
      - name: Commit verified individual artwork and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portrait-ages/cells
          git rm .github/workflows/generate-individual-portraits.yml
          git commit -m 'Generate and verify all 681 lossless individual age portraits'
          git push origin HEAD:perf/individual-age-portraits
