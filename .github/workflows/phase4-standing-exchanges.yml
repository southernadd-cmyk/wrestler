name: Phase 4 standing exchanges
on:
  pull_request:
    paths:
      - 'assets/js/match-engine.js'
      - 'tests/catalog.test.cjs'
      - 'tests/phase4-standing-exchanges.test.cjs'
      - 'tests/phase4-neck-exchanges.test.cjs'
      - 'tools/graph-lab/phase4-coverage-diagnostic.cjs'
      - 'tests/grapple-attempts.test.cjs'
      - 'tests/phase3-chain-submissions.test.cjs'
      - '.github/workflows/phase4-standing-exchanges.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standing-exchanges:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove all strike and running parents with named outcomes
        run: node tests/phase4-standing-exchanges.test.cjs
      - name: Check all 18 neck-family techniques
        run: node tests/phase4-neck-exchanges.test.cjs
      - name: Check Phase 3 chain and submission continuity
        run: |
          node tests/phase3-chain-submissions.test.cjs
          node tests/phase3-rest-control.test.cjs
          node tests/phase3-chain-transitions.test.cjs
      - name: Diagnose rare-move eligibility in exact catalogue fixtures
        run: node tools/graph-lab/phase4-coverage-diagnostic.cjs
      - name: Full catalog physical legality and 1000 bout coverage
        run: node tests/catalog.test.cjs
