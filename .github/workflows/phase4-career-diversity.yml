name: Phase 4 career diversity diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/match-engine.js'
      - 'tools/graph-lab/phase4-career-diversity.cjs'
      - 'tests/season-soak.test.cjs'
      - '.github/workflows/phase4-career-diversity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  career-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce authentic six-career 700-action variety gate
        run: node tests/season-soak.test.cjs
      - name: Create isolated baseline from main without altering PR
        run: |
          mkdir -p /tmp/the-office-baseline
          git archive origin/main | tar -x -C /tmp/the-office-baseline
      - name: Compare six deterministic career soaks (main versus PR)
        run: node tools/graph-lab/phase4-career-diversity.cjs /tmp/the-office-baseline .
      - name: Store detailed action-family comparisons
        uses: actions/upload-artifact@v4
        with:
          name: phase4-career-diversity-analysis
          path: phase4-career-soak-diagnostic.json
          if-no-files-found: error
