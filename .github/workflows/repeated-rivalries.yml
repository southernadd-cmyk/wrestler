name: Five-meeting rivalry audit

on:
  schedule:
    - cron: '33 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rivalry-variety:
    name: Five-match storyline variety
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out real match engine
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 4 five-meeting rivalries against neutral schooling
        shell: bash
        run: |
          set -euo pipefail
          node tests/rivalry.test.cjs
          node tests/repeated-rivalry-audit.test.cjs
          node tools/repeated-rivalry-audit.cjs | tee "$GITHUB_STEP_SUMMARY"
