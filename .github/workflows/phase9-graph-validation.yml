name: Phase 9 graph validation

on:
  pull_request:
    paths:
      - 'tools/graph-lab/**'
      - 'assets/js/match-engine.js'
      - 'assets/js/technique-backgrounds.js'
      - 'tests/phase9-graph-validation.test.cjs'
      - 'tests/phase9-authored-chains.test.cjs'
      - '.github/workflows/phase9-graph-validation.yml'
  push:
    branches: [main]
    paths:
      - 'tools/graph-lab/**'
      - 'assets/js/match-engine.js'
      - 'assets/js/technique-backgrounds.js'
      - 'tests/phase9-graph-validation.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-moves:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 120 real matches and injected failure cases
        run: node tests/phase9-graph-validation.test.cjs
      - name: Verify 200 bouts across nine authored move-chain contexts
        run: node tests/phase9-authored-chains.test.cjs
      - name: Capture 500-match repeatable graph evidence
        run: node tools/graph-lab/validate.cjs --count 500 > phase9-evidence.json
      # Pin the genuine Phase 8 source rather than compare with a moving
      # graph baseline or a hand-entered metric.
      - uses: actions/checkout@v4
        with:
          ref: d80139d3462cb4bb8740abd4c032c42a30b8cf81
          path: phase8-reference
          persist-credentials: false
      - name: Compare 500 same-seed Phase 8 versus Phase 9 bouts
        run: node tools/graph-lab/compare-phase8.cjs phase8-reference > phase9-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase9-graph-evidence
          path: |
            phase9-evidence.json
            phase9-comparison.json
          retention-days: 14
