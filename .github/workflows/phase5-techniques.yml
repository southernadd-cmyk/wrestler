name: Curated technique gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  curated-mechanics:
    name: Validated schools and moves
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact curated move data before costly simulations
        run: |
          node tests/technique-registry.test.cjs
          node tests/phase3-technique-sequences.test.cjs
          node tests/phase4-technique-backgrounds.test.cjs
          node tests/phase5-training-expansion.test.cjs
          node tests/phase5b-technique-review.test.cjs
          node tests/aerial-attempts.test.cjs
