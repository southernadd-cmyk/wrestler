name: Graph Lab match review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  match-review:
    name: Six scenarios / 600 real bouts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all nine outside dive commitments and top-rope positions
        run: node tests/phase6-dive-continuity.test.cjs
      - name: Verify actual low-stamina Spot-fest recovery actions
        run: node tests/phase6b-pacing.test.cjs
      - name: Verify earned quality across all five match plans
        run: node tests/phase6b-all-plan-quality.test.cjs
      - name: Run repeatability checks
        run: node tests/graph-lab-match-review.test.cjs
      - name: Verify earned high-risk star ratings
        run: node tests/phase6-showcase-rating.test.cjs
      - name: Run complete Graph Lab match review
        shell: bash
        run: |
          set -euo pipefail
          node tools/graph-lab/match-review.cjs 100 | tee "$GITHUB_STEP_SUMMARY"
      - name: Audit high-flying wrestler ratings against matched plans
        shell: bash
        run: |
          set -euo pipefail
          node tools/graph-lab/flyer-rating-audit.cjs 60 | tee -a "$GITHUB_STEP_SUMMARY"
