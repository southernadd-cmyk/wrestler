name: Phase 3 chain and submission gates
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/match-engine.js'
      - 'tests/phase3-chain-submissions.test.cjs'
      - 'tests/phase3-rest-control.test.cjs'
      - 'tests/phase3-chain-transitions.test.cjs'
      - 'tests/grapple-attempts.test.cjs'
      - '.github/workflows/phase3-chain-submissions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chain-submissions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test all newly committed chain and submission techniques
        run: node tests/phase3-chain-submissions.test.cjs
      - name: Verify positional rest holds and earned submission transitions
        run: node tests/phase3-rest-control.test.cjs
      - name: Verify non-impact chain control and escapes
        run: node tests/phase3-chain-transitions.test.cjs
      - name: Preserve original 39 Phase 2 grapples
        run: node tests/grapple-attempts.test.cjs
      - name: Check catalogue structural reachability and 1000 real bouts
        run: node tests/catalog.test.cjs
